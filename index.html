*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f0f7f2;color:#1a2e22;min-height:100vh}
:root{
  --bg:#f0f7f2;--surf:#ffffff;--surf2:#e8f5ec;--surf3:#d4edda;
  --border:#b8dfc4;--accent:#2d9e5f;--green:#22c55e;--red:#e53e3e;
  --amber:#d97706;--text:#1a2e22;--text2:#4a7a5a;--text3:#7faa8a;
  --radius:14px;--radius-sm:8px;
}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:800px;margin:0 auto}
.hdr{background:linear-gradient(135deg,#2d9e5f,#1a7a42);border-bottom:1px solid var(--border);
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hdr-logo{font-size:20px;font-weight:700;letter-spacing:-0.5px;color:#ffffff}
.hdr-logo span{color:#a8f0c6}
.hdr-date{font-size:12px;color:rgba(255,255,255,.7);font-family:'DM Mono',monospace}
.tabs{display:flex;background:#ffffff;border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:99px;z-index:40}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:70px;padding:12px 6px;text-align:center;font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;
  border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 5px;font-size:9px;margin-left:3px;vertical-align:middle}
.page{padding:14px;padding-bottom:20px}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
input[type=text],input[type=date],input[type=number],select{
  background:var(--surf2);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);padding:10px 12px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;
  transition:border-color .2s;width:100%}
input:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--text3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;
  border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;border:none;
  transition:all .15s;font-family:'DM Sans',sans-serif;letter-spacing:-.2px}
.btn-primary{background:#2d9e5f;color:#fff}.btn-primary:hover{background:#246e49}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:var(--surf2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-sm{padding:7px 12px;font-size:12px}
.btn-full{width:100%}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{flex:1}
.lodge-search{margin-bottom:10px}
.lodge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:7px}
.lodge-chip{background:var(--surf2);border:2px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 6px;text-align:center;font-size:13px;font-weight:600;color:var(--text2);
  cursor:pointer;transition:all .15s;user-select:none}
.lodge-chip:hover{border-color:var(--accent);color:var(--text)}
.lodge-chip.sel{background:#2d9e5f;border-color:#2d9e5f;color:#fff}
.lodge-chip.ok{border-color:var(--green);color:var(--green)}
.lodge-chip.short{border-color:var(--red);color:var(--red)}
.lodge-chip.over{border-color:var(--amber);color:var(--amber)}
.lodge-chip.bagged{border-color:#0288d1;color:#0288d1;background:rgba(2,136,209,0.06)}
.lodge-chip.delivered-done{border-color:var(--green);color:var(--green);background:rgba(34,197,94,0.06)}
.lodge-chip.due-checkout{border-color:var(--amber);color:var(--amber);background:rgba(245,158,11,0.06)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--surf2);padding:9px 8px;text-align:left;font-size:10px;font-weight:700;
  color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.tbl td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .center{text-align:center}
.item-name{font-weight:600;color:var(--text)}
.exp-val{color:var(--text2);font-family:'DM Mono',monospace;font-size:13px}
.stepper{display:flex;align-items:center;gap:5px;justify-content:center}
.step-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--surf3);
  color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;flex-shrink:0;font-family:'DM Sans',sans-serif}
.step-btn:active{background:#2d9e5f;color:#fff}
.step-inp{width:44px;text-align:center;padding:5px 3px;font-size:15px;font-weight:700;font-family:'DM Mono',monospace}
.chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;min-width:54px;justify-content:center}
.chip-ok{background:rgba(34,197,94,.15);color:var(--green)}
.chip-short{background:rgba(244,63,94,.15);color:var(--red)}
.chip-over{background:rgba(245,158,11,.15);color:var(--amber)}
.chip-na{background:var(--surf2);color:var(--text3)}
.alert-box{background:rgba(229,62,62,.08);border:1px solid rgba(229,62,62,.25);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.alert-box h3{color:var(--red);font-size:14px;margin-bottom:8px}
.alert-row{font-size:13px;color:var(--text2);padding:4px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.alert-row strong{color:var(--text)}
.alert-missing{color:var(--red);font-weight:700;font-family:'DM Mono',monospace}
.stock-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stock-item{background:var(--surf2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
.stock-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stock-val{font-size:22px;font-weight:700;font-family:'DM Mono',monospace}
.stock-val.low{color:var(--red)}.stock-val.ok{color:var(--green)}.stock-val.warn{color:var(--amber)}
.fc-day{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.fc-day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.fc-day-name{font-size:15px;font-weight:700}
.fc-day-date{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace}
.fc-gl-badge{background:rgba(45,158,95,.15);color:#2d9e5f;border:1px solid rgba(45,158,95,.3);
  border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
.fc-item-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.fc-item-row:last-child{border-bottom:none}
.fc-item-name{color:var(--text2)}
.fc-item-need{font-weight:700;font-family:'DM Mono',monospace}
.hist-item{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.hist-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.hist-lodge{font-size:16px;font-weight:700}
.hist-date{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px}
.hist-items{font-size:12px;color:var(--text2);line-height:2}
.edit-link{font-size:12px;color:#2d9e5f;cursor:pointer;padding:4px 8px;border-radius:4px;
  background:rgba(45,158,95,.1);white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end}
.modal{background:var(--surf);border-top:1px solid var(--border);border-radius:20px 20px 0 0;
  padding:20px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.season-row{display:flex;gap:8px;margin-bottom:12px}
.season-btn{flex:1;padding:9px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  cursor:pointer;border:1px solid var(--border);background:var(--surf2);color:var(--text2);transition:all .15s;text-align:center}
.season-btn.on{background:#2d9e5f;border-color:#2d9e5f;color:#fff}
.section-hdr{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 10px}
.field-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.mono{font-family:'DM Mono',monospace}
.c-red{color:var(--red)}.c-green{color:var(--green)}.c-amber{color:var(--amber)}.c-muted{color:var(--text3)}.c-blue{color:var(--accent)}
.watch-box{background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.25);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.menu-switcher{display:flex;background:var(--surf2);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:41}
.menu-btn{flex:1;padding:8px;text-align:center;font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;
  border-bottom:3px solid transparent;transition:all .2s;text-transform:uppercase;letter-spacing:.5px}
.menu-btn.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--surf)}
.lodge-status-chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.ls-full{background:rgba(34,197,94,.15);color:var(--green)}
.ls-short{background:rgba(229,62,62,.15);color:var(--red)}
.ls-own{background:rgba(112,48,160,.15);color:#7030a0}
.ls-unknown{background:var(--surf2);color:var(--text3)}
.pending-box{background:rgba(79,124,255,.08);border:1px solid rgba(79,124,255,.2);border-radius:var(--radius-sm);padding:10px 12px;margin-top:8px;font-size:12px;color:#4a7a5a}
@media(min-width:600px){.stock-grid{grid-template-columns:repeat(4,1fr)}}
</style>

const localLoad = (key, def) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e) { return def; } };
const localSave = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} };

const supaGet = async (key) => {
  try {
    const resp = await fetch(SUPA_URL + '/rest/v1/gl_data?key=eq.' + key + '&select=value', {
      headers: SUPA_HEADERS
    });
    if (!resp.ok) return null;
    const rows = await resp.json();
    return rows.length > 0 ? rows[0].value : null;
  } catch(e) { return null; }
};

const supaAudit = async (action, details) => {
  try {
    // Read existing audit log
    const r = await fetch(SUPA_URL + '/rest/v1/gl_data?key=eq.auditlog&select=value', {
      headers: SUPA_HEADERS
    });
    const data = await r.json();
    const log = (data[0]?.value || []).slice(0, 499); // keep last 500 entries
    const entry = {
      ts: new Date().toISOString(),
      action,
      ...details,
      device: navigator.userAgent.includes('Mobile') ? 'mobile' : 'desktop'
    };
    const newLog = [entry, ...log];
    await fetch(SUPA_URL + '/rest/v1/gl_data?key=eq.auditlog', {
      method: 'PATCH',
      headers: {...SUPA_HEADERS, 'Prefer': 'return=minimal'},
      body: JSON.stringify({ value: newLog, updated_at: new Date().toISOString() })
    });
  } catch(e) { console.error('Audit log failed:', e); }
};

const supaSet = async (key, value) => {
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/gl_data?key=eq.' + key, {
      method: 'PATCH',
      headers: {...SUPA_HEADERS, 'Prefer': 'return=minimal'},
      body: JSON.stringify({ value, updated_at: new Date().toISOString() })
    });
    return r.ok;
  } catch(e) {
    console.error('Supabase write failed:', key, e);
    return false;
  }
};

const fetchAllData = async () => {
  try {
    // Ensure auditlog key exists
    await fetch(SUPA_URL + '/rest/v1/gl_data', {
      method: 'POST',
      headers: {...SUPA_HEADERS, 'Prefer': 'resolution=ignore-duplicates'},
      body: JSON.stringify({key:'auditlog', value:[]})
    });
    const resp = await fetch(SUPA_URL + '/rest/v1/gl_data?select=key,value', {
      headers: SUPA_HEADERS
    });
    if (!resp.ok) return null;
    const rows = await resp.json();
    const data = {};
    rows.forEach(r => { data[r.key] = r.value; });
    return {
      shelf:          data.shelf          || {},
      counts:         data.counts         || [],
      glFlow:         data.glflow         || [],
      watchList:      data.watchlist      || [],
      lodges:         data.lodges && Object.keys(data.lodges).length > 0 ? data.lodges : null,
      season:         data.season         || 'high',
      lodgeStatus:    data.lodgestatus    || {},
      pendingReturns: data.pendingreturns || [],
      deferred:       data.deferred       || {},
      _updated:       data.updated_at     || null
    };
  } catch(e) { console.error('fetchAllData failed:', e); return null; }
};

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('countin');
  const [lodges, setLodges] = useState(DEFAULT_LODGES);
  const [counts, setCounts] = useState([]);
  const [shelf, setShelf] = useState({});
  const [glFlow, setGlFlow] = useState([]);
  const [watchList, setWatchList] = useState([]);
  const [season, setSeason] = useState('high');
  const [lodgeStatus, setLodgeStatus] = useState({});
  const [pendingReturns, setPendingReturns] = useState([]);
  const [todayCheckouts, setTodayCheckouts] = useState([]); // from checkouts.json
  const [allCheckouts, setAllCheckouts] = useState({}); // full schedule for upcoming lookups
  const [deferred, setDeferred] = useState({});  // lodge -> date deferred
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const [syncError, setSyncError] = useState(false);
  const [showRefreshPrompt, setShowRefreshPrompt] = useState(false);
  const lastActivityRef = React.useRef(Date.now());
  const INACTIVITY_MS = 30 * 60 * 1000; // 30 minutes

  // Track user activity
  React.useEffect(() => {
    const resetTimer = () => { lastActivityRef.current = Date.now(); setShowRefreshPrompt(false); };
    const events = ['touchstart','mousedown','keydown'];
    events.forEach(e => window.addEventListener(e, resetTimer));
    const interval = setInterval(() => {
      if (Date.now() - lastActivityRef.current > INACTIVITY_MS) {
        setShowRefreshPrompt(true);
      }
    }, 60000); // check every minute
    return () => { events.forEach(e => window.removeEventListener(e, resetTimer)); clearInterval(interval); };
  }, []);
  const [menu, setMenu] = useState('ops');

  // Load data — localStorage first for speed, then sync from shared storage
  useEffect(() => {
    const init = async () => {
      setLoading(true);

      // Step 1 — load from localStorage immediately (fast, works offline)
      const cached = localLoad('gl:cache', null);
      if (cached) {
        if (cached.lodges) setLodges(cached.lodges);
        setCounts(pruneOld(cached.counts || []));
        setShelf(cached.shelf || {});
        setWatchList(cached.watchList || []);
        setSeason(cached.season || 'high');
      }
      // Fetch today's checkouts from checkouts.json
      try {
        const coResp = await fetch(GITHUB_JSON_URL + '?t=' + Date.now());
        if (coResp.ok) {
          const coData = await coResp.json();
          const td = todayStr();
          setTodayCheckouts(coData[td] || []);
          setAllCheckouts(coData);
        }
      } catch(e) { console.error('Checkouts fetch failed:', e); }

      setLoading(false);

      // Step 2 — always sync from Supabase (shared across devices)
      const data = await fetchAllData();
      if (data) {
        if (data.lodges) setLodges(data.lodges);
        setCounts(pruneOld(data.counts || []));
        setShelf(data.shelf || {});
        setGlFlow(data.glFlow || []);
        setWatchList(data.watchList || []);
        setSeason(data.season || 'high');
        setLodgeStatus(data.lodgeStatus || {});
        setPendingReturns(data.pendingReturns || []);
        setDeferred(data.deferred || {});
        localSave('gl:cache', data);
        setLastSync(new Date().toLocaleTimeString('en-GB'));
      }
    };
    init();
  }, []);

  // Save locally and post to Apps Script for server-side Google Sheet write
  const syncKey = async (key, value) => {
    setSyncing(true);
    const ok = await supaSet(key, value);
    if (ok) {
      setLastSync(new Date().toLocaleTimeString('en-GB'));
      setSyncError(false);
    } else {
      setSyncError(true);
    }
    setSyncing(false);
    return ok;
  };

  const updateCache = (overrides) => {
    const updated = { lodges, counts, shelf, glFlow, watchList, season,
      _updated: new Date().toISOString(), ...overrides };
    localSave('gl:cache', updated);
    return updated;
  };

  const saveLodges        = v => { setLodges(v); updateCache({lodges:v}); syncKey('lodges', v); };
  const saveCounts = async (v, auditDetails) => {
    const p = pruneOld(v);
    const ok = await syncKey('counts', p);
    if (ok) {
      setCounts(p);
      updateCache({counts:p});
      if (auditDetails) supaAudit('count_saved', auditDetails);
    } else {
      alert('⚠️ Save failed — please try again or write down the count and contact management.');
    }
  };
  // saveShelf now auto-audits every shelf change. The 'source' parameter
  // lets callers tag what kind of change it is (e.g. 'delivery', 'add_stock',
  // 'gl_flow_delivery', 'short_return', 'shortfall_correction'). If a caller
  // forgets to set source, we still log it as 'shelf_changed' so nothing
  // can slip through unaudited.
  const saveShelf = (v, source, extras) => {
    const oldShelf = shelf || {};
    const delta = {};
    let anyChange = false;
    const allItems = new Set([...Object.keys(oldShelf), ...Object.keys(v || {})]);
    allItems.forEach(k => {
      if (k.startsWith('_')) return;
      const oldV = oldShelf[k] || 0;
      const newV = (v && v[k]) || 0;
      if (oldV !== newV) {
        delta[k] = newV - oldV;
        anyChange = true;
      }
    });
    setShelf(v);
    updateCache({shelf:v});
    syncKey('shelf', v);
    if (anyChange) {
      const action = source || 'shelf_changed';
      supaAudit(action, {delta, ...(extras || {}), ts: new Date().toISOString()});
    }
  };
  const saveGlFlow        = v => { setGlFlow(v); updateCache({glFlow:v}); syncKey('glflow', v); };
  const saveWatch         = v => { setWatchList(v); updateCache({watchList:v}); syncKey('watchlist', v); };
  const saveSeason        = v => { setSeason(v); updateCache({season:v}); syncKey('season', v); };
  const saveLodgeStatus   = v => { setLodgeStatus(v); updateCache({lodgeStatus:v}); syncKey('lodgestatus', v); };
  const savePendingReturns= v => { setPendingReturns(v); updateCache({pendingReturns:v}); syncKey('pendingreturns', v); };
  const saveDeferred      = v => { setDeferred(v); updateCache({deferred:v}); syncKey('deferred', v); };

  if (loading) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',
      background:'#f0f7f2',color:'#4a7a5a',flexDirection:'column',gap:12}}>
      <div style={{fontSize:40}}>🧺</div>
      <div style={{fontSize:16,fontWeight:600}}>GL Linen</div>
      <div style={{fontSize:13,color:'#7faa8a'}}>Loading shared data...</div>
    </div>
  );

  const shortAlerts = counts.filter(c => c.hasShort && c.date === todayStr());
  const opsTabs   = [['countin','Bag In'],['out','Delivery'],['alerts','Alerts'],['forecast','Forecast']];
  const stockTabs = [['warehouse','Warehouse'],['glflow','GL Flow'],['glsummary','GL Summary'],['daily','Daily Report']];
  const adminTabs = [['history','History'],['weeklysummary','Weekly Summary'],['settings','Lodge Setup'],['pendingreturns','Pending Returns']];
  const activeTabs = menu==='ops' ? opsTabs : menu==='stock' ? stockTabs : adminTabs;

  return (
    <div className="app">
      {showRefreshPrompt && <div style={{
        position:'fixed',top:0,left:0,right:0,bottom:0,
        background:'rgba(0,0,0,.85)',zIndex:9999,
        display:'flex',alignItems:'center',justifyContent:'center',padding:16
      }} onClick={e=>e.stopPropagation()}>
        <div style={{background:'var(--surf)',borderRadius:12,padding:24,maxWidth:360,width:'100%',textAlign:'center'}} onClick={e=>e.stopPropagation()}>
          <div style={{fontSize:32,marginBottom:12}}>⏰</div>
          <div style={{fontWeight:700,fontSize:18,marginBottom:8}}>App not used for 30 minutes</div>
          <div style={{fontSize:14,color:'var(--text2)',marginBottom:20}}>
            Please refresh to get the latest data before entering any counts or deliveries.
          </div>
          <button className="btn btn-primary btn-full" onClick={()=>{
            // Force fresh page load — bypasses cache.
            // Adding a timestamp guarantees the browser asks the server for a new copy.
            const u = new URL(window.location.href);
            u.searchParams.set('r', Date.now().toString());
            window.location.href = u.toString();
          }}>
            🔄 Refresh Now
          </button>
          <button className="btn btn-ghost btn-full" style={{marginTop:8}} onClick={()=>{setShowRefreshPrompt(false);lastActivityRef.current=Date.now();}}>
            Continue without refreshing
          </button>
        </div>
      </div>}
      <div className="hdr">
        <div>
          <div className="hdr-logo">GL <span>Linen</span></div>
          <div className="hdr-date">{fmtDateLong(todayStr())}</div>
        </div>
        <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
          <div style={{fontSize:24}}>🧺</div>
          {syncing && <div style={{fontSize:10,color:'rgba(255,255,255,.7)'}}>⟳ Syncing...</div>}
          {syncError && !syncing && <div style={{fontSize:10,color:'#ff6b6b',fontWeight:700}}>⚠ Sync failed — try again</div>}
          {lastSync && !syncing && <div style={{fontSize:10,color:'rgba(255,255,255,.5)'}}>✓ {lastSync}</div>}
        </div>
      </div>
      <div className="menu-switcher">
        <div className={`menu-btn${menu==='ops'?' on':''}`} onClick={()=>{setMenu('ops');setTab('countin');}}>📋 Daily Ops</div>
        <div className={`menu-btn${menu==='stock'?' on':''}`} onClick={()=>{setMenu('stock');setTab('warehouse');}}>📦 Stock</div>
        <div className={`menu-btn${menu==='admin'?' on':''}`} onClick={()=>{setMenu('admin');setTab('history');}}>⚙️ Admin</div>
      </div>
      <div className="tabs">
        {activeTabs.map(([id,label]) => (
          <div key={id} className={`tab${tab===id?' on':''}`} onClick={() => setTab(id)}>
            {label}
            {id==='alerts' && shortAlerts.length > 0 && <span className="badge">{shortAlerts.length}</span>}
          </div>
        ))}
      </div>
      <div className="page">
        {tab==='countin'    && <CountTab lodges={lodges} counts={counts} saveCounts={saveCounts} shelf={shelf} saveShelf={saveShelf} todayCheckouts={todayCheckouts} deferred={deferred} saveDeferred={saveDeferred}/>}
        {tab==='out'        && <StockOutTab lodges={lodges} counts={counts} saveCounts={saveCounts} shelf={shelf} saveShelf={saveShelf} todayCheckouts={todayCheckouts} allCheckouts={allCheckouts}/>}
        {tab==='alerts'     && <AlertsTab counts={counts} saveCounts={saveCounts} shelf={shelf} saveShelf={saveShelf} todayCheckouts={todayCheckouts} deferred={deferred} saveDeferred={saveDeferred}/>}
        {tab==='glflow'     && <GlFlowTab glFlow={glFlow} saveGlFlow={saveGlFlow} counts={counts} watchList={watchList} saveWatch={saveWatch} shelf={shelf} saveShelf={saveShelf}/>}
        {tab==='forecast'   && <ForecastTab shelf={shelf} lodges={lodges} season={season} saveSeason={saveSeason} glFlow={glFlow}/>}
        {tab==='warehouse'  && <StockTab shelf={shelf} saveShelf={saveShelf}/>}
        {tab==='lodgestock' && <LodgeStockTab lodges={lodges} lodgeStatus={lodgeStatus} saveLodgeStatus={saveLodgeStatus} pendingReturns={pendingReturns} savePendingReturns={savePendingReturns} shelf={shelf} saveShelf={saveShelf}/>}
        {tab==='glsummary'  && <GlSummaryTab glFlow={glFlow} watchList={watchList}/>}
        {tab==='daily'      && <DailyReportTab counts={counts} todayCheckouts={todayCheckouts} deferred={deferred} saveDeferred={saveDeferred} lodges={lodges}/>}
        {tab==='history'    && <HistoryTab counts={counts} saveCounts={saveCounts} shelf={shelf} saveShelf={saveShelf} lodges={lodges}/>}
        {tab==='weeklysummary' && <WeeklySummaryTab counts={counts} lodges={lodges} glFlow={glFlow}/>}
        {tab==='settings'   && <SettingsTab lodges={lodges} saveLodges={saveLodges}/>}
        {tab==='pendingreturns' && <LodgeStockTab lodges={lodges} lodgeStatus={lodgeStatus} saveLodgeStatus={saveLodgeStatus} pendingReturns={pendingReturns} savePendingReturns={savePendingReturns} shelf={shelf} saveShelf={saveShelf}/>}
      </div>
    </div>
  );
}

// ── STOCK OUT TAB ─────────────────────────────────────────────────────────────
function StockOutTab({lodges, counts, saveCounts, shelf, saveShelf, todayCheckouts, allCheckouts}) {
  const [selected, setSelected] = useState(null);
  const [qty, setQty] = useState({});
  const [done, setDone] = useState(false);
  const [search, setSearch] = useState('');
  const [staffName, setStaffName] = useState('');

  const ITEMS = ['Bath Sheet','Bath Mat','Hand Towel','S King D','S King S',
                 'King D','King S','Single D','Single S','Pillow C','Oxford','Tea Towel'];

  const lodgeList = Object.keys(lodges).filter(l =>
    !lodges[l]?.ownLinen && lodges[l] &&
    (search==='' || l.toLowerCase().includes(search.toLowerCase()))
  ).sort();

  // Check if already stocked out today or in last 2 days
  const twoDaysAgo = new Date(); twoDaysAgo.setDate(twoDaysAgo.getDate()-2);
  const twoDaysAgoStr = twoDaysAgo.toISOString().split('T')[0];
  const hasStockOut = l => counts.some(c=>c.lodge===l&&c.date>=twoDaysAgoStr&&c.type==='stockout');

  const selectLodge = l => {
    setSelected(l);
    setDone(false);
    // Pre-fill with lodge's full set
    const linen = lodges[l] || {};
    setQty({...linen});
  };

  const adj = (item, d) => setQty(p=>({...p,[item]:Math.max(0,(p[item]??0)+d)}));

  const submit = () => {
    if (!selected) return;
    const entry = {
      id: Date.now(), type: 'stockout', lodge: selected,
      date: todayStr(), actual: {...qty}, staffName, ts: new Date().toISOString()
    };
    // Deduct from shelf
    const newShelf = {...shelf};
    ITEMS.forEach(item => {
      if (qty[item]) newShelf[item] = Math.max(0, (newShelf[item]||0) - qty[item]);
    });
    const totalOut = Object.values(qty).reduce((s,v)=>s+(v||0),0);
    saveCounts([entry, ...counts]);
    saveShelf(newShelf, 'stockout_saved', {lodge: selected, date: todayStr(), staffName, totalOut, qty: {...qty}});
    setDone(true);
    setSelected(null);
    setQty({});
    setTimeout(()=>setDone(false), 2000);
  };

  // 3-day window for "bagged" state — covers Fri-bagged Mon-delivered
  const threeDaysAgo = new Date(); threeDaysAgo.setDate(threeDaysAgo.getDate()-3);
  const threeDaysAgoStr = threeDaysAgo.toISOString().split('T')[0];

  // Delivery tab chip state — based ONLY on deliveries and today's checkout list.
  // Bag-ins on a lodge do NOT affect the Delivery tab.
  // Returned-unused deliveries are excluded — they shouldn't show as "bagged".
  const recentDeliveryCount = l =>
    counts.filter(c => c.lodge===l && c.type==='stockout' && !c.returnedUnused && c.date>=threeDaysAgoStr).length;
  const hasRecentDelivery = l => recentDeliveryCount(l) > 0;

  // Find next upcoming checkout date for a lodge — strictly AFTER today
  const nextCheckoutFor = l => {
    if (!allCheckouts) return null;
    const today = todayStr();
    const dates = Object.keys(allCheckouts).filter(d => !d.startsWith('_')).sort();
    for (const d of dates) {
      if (d <= today) continue;  // skip past dates AND today itself
      if ((allCheckouts[d] || []).includes(l)) return d;
    }
    return null;
  };

  // Short day label, e.g. "Mon", "Today" if today
  const shortDayLabel = (dateStr) => {
    if (!dateStr) return '';
    if (dateStr === todayStr()) return 'today';
    try {
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-GB', {weekday: 'short'});
    } catch(e) { return dateStr.slice(5); }
  };

  const chipCls = l => {
    let cls = 'lodge-chip';
    if (selected===l) return cls + ' sel';
    if (hasRecentDelivery(l))         cls += ' bagged';        // blue — clean bag made up recently
    else if (todayCheckouts.includes(l)) cls += ' due-checkout'; // amber — checks out today, no bag yet
    return cls;
  };

  return <>
    <div style={{background:'rgba(0,100,200,.06)',borderRadius:8,padding:'4px 4px 0',marginBottom:4,
      borderTop:'3px solid rgba(0,120,255,.4)'}}>
    <div className="card" style={{background:'rgba(0,100,200,.04)'}}>
      <div style={{fontWeight:700,color:'rgba(0,120,255,.9)',fontSize:13,marginBottom:4}}>📤 Delivery — Clean Linen Going Out</div>
      <div style={{fontSize:12,color:'var(--text2)',marginBottom:8}}>Record clean linen bags going out to lodges. Select a lodge, adjust quantities if sending a partial set, then confirm.</div>
      <div className="field-label">Search Lodge</div>
      <input placeholder="Search lodge..." value={search} onChange={e=>setSearch(e.target.value)}/>
    </div>

    {done && <div className="card" style={{background:'rgba(72,199,142,.1)',border:'1px solid rgba(72,199,142,.3)',textAlign:'center',color:'var(--green)',fontWeight:700}}>
      ✓ Stock out recorded
    </div>}

    <div className="lodge-grid">
      {lodgeList.map(l => {
        const delCount = recentDeliveryCount(l);
        const isCheckoutToday = todayCheckouts.includes(l);
        const isActive = delCount > 0 || isCheckoutToday;
        const nextCheck = isActive ? nextCheckoutFor(l) : null;
        const nextLabel = shortDayLabel(nextCheck);
        return (
          <div key={l} className={chipCls(l)} onClick={()=>selectLodge(l)}>
            {l}
            {delCount > 0 && <span style={{fontSize:8,display:'block',color:'#0288d1'}}>
              📦 bagged{delCount > 1 ? ' ×' + delCount : ''}
            </span>}
            {delCount === 0 && isCheckoutToday && <span style={{fontSize:8,display:'block',color:'var(--amber)'}}>
              checkout
            </span>}
            {nextCheck && <span style={{fontSize:8,display:'block',color:'var(--text3)',marginTop:1}}>
              next: {nextLabel}
            </span>}
          </div>
        );
      })}
    </div>

    {selected && <>
      <div className="card" style={{marginTop:12,background:'rgba(0,100,200,.06)',border:'1px solid rgba(0,120,255,.2)'}}>
        <div className="card-title" style={{color:'rgba(0,120,255,.9)'}}>📤 Stock Out — {selected}</div>
        <div style={{fontSize:12,color:'var(--text2)',marginBottom:12}}>
          Adjust quantities if not sending a full set
        </div>
        <table className="tbl">
          <thead><tr><th>Item</th><th className="center">Qty</th><th className="center">Adjust</th></tr></thead>
          <tbody>
            {ITEMS.filter(item=>(lodges[selected]||{})[item]>0).map(item=>(
              <tr key={item}>
                <td className="item-name">{item}</td>
                <td className="center mono" style={{fontWeight:700}}>{qty[item]||0}</td>
                <td className="center">
                  <div style={{display:'flex',gap:6,justifyContent:'center'}}>
                    <button className="btn btn-sm" onClick={()=>adj(item,-1)}>−</button>
                    <button className="btn btn-sm" onClick={()=>adj(item,1)}>+</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        <div style={{marginBottom:8}}>
          <div className="field-label">Delivered by</div>
          <select value={staffName||''} onChange={e=>setStaffName(e.target.value)}
            style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1px solid rgba(0,120,255,.3)',
              background:'rgba(0,100,200,.04)',color:'var(--text)',fontSize:14}}>
            <option value="">— Select name —</option>
            <option value="Lee">Lee</option>
            <option value="Rachel">Rachel</option>
            <option value="Kate">Kate</option>
            <option value="Pete">Pete</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button className="btn btn-primary btn-full" style={{marginTop:12}} onClick={submit}
          disabled={!staffName}>
          📤 Confirm Stock Out — {selected}
        </button>
        {!staffName && <div style={{fontSize:11,color:'var(--text3)',textAlign:'center',marginTop:4}}>Please select your name before submitting</div>}
        <button className="btn btn-ghost btn-full" style={{marginTop:6}} onClick={()=>setSelected(null)}>
          Cancel
        </button>
      </div>
    </>}
    </div>
  </>;
}

function CountTab({lodges, counts, saveCounts, shelf, saveShelf, todayCheckouts, deferred, saveDeferred}) {
  const [date, setDate] = useState(todayStr());
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [current, setCurrent] = useState({});
  const [staffName, setStaffName] = useState('');
  const [done, setDone] = useState(false);
  const [stockOutLodge, setStockOutLodge] = useState(null);
  const [stockOutQty, setStockOutQty] = useState({});
  const [stockOutDone, setStockOutDone] = useState(false);

  const lodgeNames = Object.keys(lodges).sort();
  const filtered = lodgeNames.filter(l => l.toLowerCase().includes(search.toLowerCase()));
  const countFor = lodge => counts.find(c => c.lodge===lodge && c.date===date && c.type!=='stockout');

  const selectLodge = lodge => {
    const ex = countFor(lodge);
    setCurrent(ex ? {...ex.actual} : {});
    setSelected(lodge); setDone(false);
    // Always close stock out form when selecting a lodge for counting
    setStockOutLodge(null); setStockOutQty({});
  };

  const adj = (item, d) => setCurrent(p => ({...p,[item]:Math.max(0,(p[item]??0)+d)}));
  const setV = (item, v) => { const n=parseInt(v); setCurrent(p => ({...p,[item]:isNaN(n)?0:Math.max(0,n)})); };

  const openStockOut = (lodge) => {
    const expected = lodges[lodge] || {};
    const qty = {};
    ITEMS.forEach(item => { if ((expected[item]||0) > 0) qty[item] = expected[item]; });
    setStockOutLodge(lodge);
    setStockOutQty(qty);
    setStockOutDone(false);
    setSelected(null);
  };

  const confirmStockOut = () => {
    const newShelf = {...shelf};
    ITEMS.forEach(item => {
      newShelf[item] = (newShelf[item]||0) - (stockOutQty[item]||0);
    });
    newShelf._updated = new Date().toISOString();
    saveShelf(newShelf, 'stockout_from_bagin', {lodge: stockOutLodge, date, staffName, qty: {...stockOutQty}});

    // Record stock out in history
    const entry = {
      id: Date.now(),
      lodge: stockOutLodge,
      date,
      type: 'stockout',
      expected: lodges[stockOutLodge]||{},
      actual: {...stockOutQty},
      shorts: [], overs: [],
      hasShort: false, hasOver: false,
      ts: new Date().toISOString()
    };
    saveCounts([entry, ...counts.filter(c=>!(c.lodge===stockOutLodge && c.date===date && c.type==='stockout'))]);

    setStockOutDone(true);
    setStockOutLodge(null);
    setStockOutQty({});
  };

  const submit = () => {
    if (!selected) return;
    // Validation: warn if no delivery recorded for this lodge in last 3 days
    const threeDaysAgo = new Date(); threeDaysAgo.setDate(threeDaysAgo.getDate()-3);
    const threeDaysAgoStr = threeDaysAgo.toISOString().split('T')[0];
    const hasDelivery = counts.some(c => c.lodge===selected && c.type==='stockout' && !c.returnedUnused && c.date>=threeDaysAgoStr);
    if (!hasDelivery) {
      const ok = window.confirm(`⚠️ No delivery recorded for ${selected} in the last 3 days.\n\nAre you sure you want to submit a bag in count?\n\nIf clean linen was sent, please record it in the Delivery tab first.`);
      if (!ok) return;
    }
    const expected = lodges[selected]||{};
    // Treat any unsubmitted item with expected > 0 as 0 (not counted = missing)
    const actual = {};
    Object.keys(expected).forEach(item => {
      if ((expected[item]||0) > 0) {
        actual[item] = current[item] !== undefined && current[item] !== '' ? parseInt(current[item]) : 0;
      }
    });
    const shorts=[], overs=[];
    Object.keys(expected).forEach(item => {
      const exp=expected[item]||0, act=actual[item]??0;
      if (exp>0) { if(act<exp) shorts.push(item); if(act>exp) overs.push(item); }
    });
    // Validation: warn if total count is very different from expected (>30% variance)
    const totalExp = Object.values(expected).reduce((s,v)=>s+(v||0),0);
    const totalAct = Object.values(actual).reduce((s,v)=>s+(v||0),0);
    if (totalExp > 0 && Math.abs(totalAct-totalExp)/totalExp > 0.3) {
      const ok = window.confirm(`⚠️ Unusual count for ${selected}\n\nExpected: ${totalExp} items\nYou entered: ${totalAct} items\n\nThis is more than 30% different from expected. Please double-check before submitting.`);
      if (!ok) return;
    }
    const entry = {id:Date.now(),lodge:selected,date,expected,actual,shorts,overs,
      hasShort:shorts.length>0,hasOver:overs.length>0,staffName,ts:new Date().toISOString()};
    saveCounts(
      [entry,...counts.filter(c=>!(c.lodge===selected&&c.date===date))],
      {lodge:selected, date, staffName, shorts, overs, totalActual:Object.values(actual).reduce((s,v)=>s+v,0)}
    );
    setDone(true); setSelected(null); setCurrent({});
  };

  const chipCls = lodge => {
    const c = countFor(lodge);
    if (!c) return lodge===selected?'lodge-chip sel':'lodge-chip';
    return `lodge-chip ${c.hasShort?'short':c.hasOver?'over':'ok'}`;
  };

  return <>
    <div style={{background:'rgba(72,199,142,.08)',borderRadius:8,padding:'10px 12px',marginBottom:8,
      borderLeft:'4px solid var(--green)'}}>
      <div style={{fontWeight:700,color:'var(--green)',fontSize:13}}>🧺 Bag In — Count Dirty Linen</div>
      <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>Count dirty linen arriving back from lodges. Select a lodge, enter quantities, select your name, then submit.</div>
    </div>
    {done && <div className="card" style={{background:'rgba(34,197,94,.1)',border:'1px solid rgba(34,197,94,.3)'}}>
      <div style={{color:'var(--green)',fontWeight:700}}>✓ Count submitted</div></div>}
    {stockOutDone && <div className="card" style={{background:'rgba(34,197,94,.1)',border:'1px solid rgba(34,197,94,.3)'}}>
      <div style={{color:'var(--green)',fontWeight:700}}>✓ Stock deducted from warehouse</div></div>}

    <div className="card">
      <div className="card-title">Session Date</div>
      <input type="date" value={date} onChange={e=>{setDate(e.target.value);setSelected(null);}}/>
    </div>

    <div className="card">
      <div className="card-title">Select Lodge</div>
      <input className="lodge-search" type="text" placeholder="Search lodge..." value={search} onChange={e=>setSearch(e.target.value)}/>
      <div className="lodge-grid">
        {filtered.map(l => {
          const now = new Date();
          const isPast4pm = now.getHours() >= 16;
          const hasCheckout = todayCheckouts.includes(l);
          const hasCount = counts.some(c => c.lodge===l && c.date===date && c.type!=='stockout');
          const isDeferred = deferred && deferred[l] === date;
          const needsCount = hasCheckout && !hasCount && !isDeferred;
          const chipWarning = needsCount && isPast4pm;
          return (
            <div key={l} style={{display:'flex',flexDirection:'column',gap:4}}>
              <div className={chipCls(l)} onClick={()=>selectLodge(l)} style={{
                outline: chipWarning ? '2px solid var(--red)' : 'none',
                position:'relative'
              }}>
                {l}
                {needsCount && !isPast4pm && <span style={{fontSize:8,display:'block',color:'var(--amber)'}}>⚠ count?</span>}
                {chipWarning && <span style={{fontSize:8,display:'block',color:'var(--red)'}}>🔴 no count!</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>

    {stockOutLodge && (() => {
      const expected = lodges[stockOutLodge]||{};
      return <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <div>
            <div style={{fontSize:20,fontWeight:700}}>{stockOutLodge} — Stock Out</div>
            <div style={{fontSize:12,color:'var(--text2)'}}>Adjust quantities if bag is short, then confirm</div>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setStockOutLodge(null)}>✕</button>
        </div>
        <table className="tbl">
          <thead><tr><th>Item</th><th className="center">Full Set</th><th className="center">Sending</th></tr></thead>
          <tbody>{ITEMS.filter(i=>(expected[i]||0)>0).map(item => (
            <tr key={item}>
              <td className="item-name">{item}</td>
              <td className="center exp-val">{expected[item]}</td>
              <td><div className="stepper">
                <button className="step-btn" onClick={()=>setStockOutQty(p=>({...p,[item]:Math.max(0,(p[item]||0)-1)}))}>−</button>
                <input className="step-inp" type="number" min="0" value={stockOutQty[item]||0}
                  onChange={e=>setStockOutQty(p=>({...p,[item]:Math.max(0,parseInt(e.target.value)||0)}))}/>
                <button className="step-btn" onClick={()=>setStockOutQty(p=>({...p,[item]:(p[item]||0)+1}))}>+</button>
              </div></td>
            </tr>
          ))}</tbody>
        </table>
        <div className="btn-row">
          <button className="btn btn-ghost" onClick={()=>setStockOutLodge(null)}>Cancel</button>
          <button className="btn btn-success" onClick={confirmStockOut}>✓ Confirm Stock Out</button>
        </div>
      </div>;
    })()}
    {selected && (() => {
      const expected = lodges[selected]||{};
      const items = ITEMS.filter(i=>(expected[i]||0)>0);
      return <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <div><div style={{fontSize:20,fontWeight:700}}>{selected}</div>
            <div style={{fontSize:12,color:'var(--text2)'}}>Enter quantities from bag</div></div>
          <button className="btn btn-ghost btn-sm" onClick={()=>{setSelected(null);setCurrent({});}}>✕</button>
        </div>
        <table className="tbl">
          <thead><tr><th>Item</th><th className="center">Expected</th><th className="center">Actual</th><th className="center">Status</th></tr></thead>
          <tbody>{items.map(item => {
            const exp=expected[item]||0, act=current[item]??'', diff=act!==''?act-exp:null;
            return <tr key={item}>
              <td className="item-name">{item}</td>
              <td className="center exp-val">{exp}</td>
              <td><div className="stepper">
                <button className="step-btn" onClick={()=>adj(item,-1)}>−</button>
                <input className="step-inp" type="number" min="0" value={act} onChange={e=>setV(item,e.target.value)}/>
                <button className="step-btn" onClick={()=>adj(item,1)}>+</button>
              </div></td>
              <td className="center">
                {diff===null?<span className="chip chip-na">—</span>
                  :diff<0?<span className="chip chip-short">▼ {Math.abs(diff)}</span>
                  :diff>0?<span className="chip chip-over">▲ {diff}</span>
                  :<span className="chip chip-ok">✓ OK</span>}
              </td>
            </tr>;
          })}</tbody>
        </table>
        <div style={{marginTop:12,marginBottom:8}}>
          <div className="field-label">Counted by</div>
          <select value={staffName} onChange={e=>setStaffName(e.target.value)}
            style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1px solid var(--border)',
              background:'var(--surf2)',color:'var(--text)',fontSize:14}}>
            <option value="">— Select your name —</option>
            <option value="Lee">Lee</option>
            <option value="Rachel">Rachel</option>
            <option value="Kate">Kate</option>
            <option value="Pete">Pete</option>
            <option value="Other">Other</option>
          </select>
          {!staffName && <div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>Select your name before submitting</div>}
        </div>
        <div className="btn-row">
          <button className="btn btn-ghost" onClick={()=>setCurrent({})}>Reset</button>
          <button className="btn btn-primary" onClick={submit} disabled={!staffName}>✓ Submit Count</button>
        </div>
      </div>;
    })()}
  </>;
}

// ── ALERTS TAB ────────────────────────────────────────────────────────────────
function AlertsTab({counts, saveCounts, shelf, saveShelf, todayCheckouts, deferred, saveDeferred}) {
  // Weekly reconciliation — check every Monday if stock has drifted
  const reconciliationAlert = React.useMemo(() => {
    const today = new Date();
    if (today.getDay() !== 1) return null; // Only on Mondays
    if (!shelf || !shelf._date) return null;
    const lastCount = new Date(shelf._date + 'T12:00:00');
    const daysSince = Math.floor((today - lastCount) / (1000*60*60*24));
    if (daysSince > 7) {
      return `Warehouse stock was last counted ${daysSince} days ago (${shelf._date}). Please do a manual count to verify stock levels.`;
    }
    return null;
  }, [shelf]);
  const alerts = counts.filter(c=>c.date===todayStr()&&c.hasShort);
  // Look back 2 days for stock outs — bags sometimes prepared in advance
  const twoDaysAgo = new Date(); twoDaysAgo.setDate(twoDaysAgo.getDate()-2);
  const twoDaysAgoStr = twoDaysAgo.toISOString().split('T')[0];
  // A returned-unused delivery suppresses ALL alerts for that lodge on that date
  const noServiceToday = new Set(
    counts.filter(c => c.type==='stockout' && c.returnedUnused && c.date===todayStr())
          .map(c => c.lodge)
  );
  const confirmedOut = counts.filter(c=>c.date>=twoDaysAgoStr&&c.type==='stockout'&&!c.returnedUnused).map(c=>c.lodge);
  const unconfirmed = (todayCheckouts||[]).filter(l=>!confirmedOut.includes(l) && !noServiceToday.has(l));
  const isPast4pm = new Date().getHours() >= 16;

  if (!alerts.length && !unconfirmed.length && !reconciliationAlert) return <div className="empty"><div className="empty-icon">✅</div>No alerts today</div>;

  const markRetrieved = (id, item) => {
    saveCounts(counts.map(c => {
      if (c.id!==id) return c;
      const actual={...c.actual,[item]:c.expected[item]};
      const shorts=c.shorts.filter(s=>s!==item);
      return {...c,actual,shorts,hasShort:shorts.length>0};
    }));
  };

  const returnToStock = (id, item) => {
    // Find the entry and work out how many are missing
    const entry = counts.find(c=>c.id===id);
    if (!entry) return;
    const missing = (entry.expected[item]||0) - (entry.actual[item]||0);
    if (missing <= 0) return;
    // Add missing qty back to shelf stock
    saveShelf({...shelf, [item]: Math.max(0, (shelf[item]||0) + missing)}, 'short_returned_to_stock', {lodge: entry.lodge, item, missing, source: 'alerts_tab'});
    // Mark as retrieved in the count
    saveCounts(counts.map(c => {
      if (c.id!==id) return c;
      const actual={...c.actual,[item]:c.expected[item]};
      const shorts=c.shorts.filter(s=>s!==item);
      return {...c,actual,shorts,hasShort:shorts.length>0};
    }));
  };

  // Uncounted lodges — checked out today but no count submitted
  const uncounted = (todayCheckouts||[]).filter(l => {
    if (deferred && deferred[l] === todayStr()) return false; // deferred
    if (noServiceToday.has(l)) return false; // delivery was returned unused
    return !counts.some(c => c.lodge===l && c.date>=twoDaysAgoStr && c.type!=='stockout');
  });

  const deferLodge = (lodge) => {
    const updated = {...(deferred||{}), [lodge]: todayStr()};
    saveDeferred(updated);
  };

  return <>
    {reconciliationAlert && <div className="card" style={{background:'rgba(211,139,0,.08)',border:'1px solid rgba(211,139,0,.3)',marginBottom:8}}>
      <div style={{fontWeight:700,color:'var(--amber)',marginBottom:4}}>📅 Weekly Stock Check</div>
      <div style={{fontSize:13}}>{reconciliationAlert}</div>
    </div>}
    {unconfirmed.length > 0 && <div className="card" style={{
      background: isPast4pm ? 'rgba(229,62,62,.08)' : 'rgba(245,158,11,.06)',
      border: `1px solid ${isPast4pm ? 'rgba(229,62,62,.25)' : 'rgba(245,158,11,.25)'}`,
      marginBottom:12
    }}>
      <div style={{fontWeight:700, color: isPast4pm ? 'var(--red)' : 'var(--amber)', marginBottom:8, fontSize:14}}>
        {isPast4pm ? '🔴' : '⚠'} Unconfirmed Stock Outs Today ({unconfirmed.length})
      </div>
      <div style={{fontSize:12,color:'var(--text2)',marginBottom:8}}>
        {isPast4pm ? 'Past 4pm — these lodges have not had stock confirmed out:' : 'These lodges have checkouts today but no stock out recorded yet:'}
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
        {unconfirmed.map(l => <span key={l} style={{
          padding:'4px 10px', borderRadius:'20px', fontSize:12, fontWeight:700,
          background: isPast4pm ? 'rgba(229,62,62,.15)' : 'rgba(245,158,11,.15)',
          color: isPast4pm ? 'var(--red)' : 'var(--amber)'
        }}>{l}</span>)}
      </div>
    </div>}

    {uncounted.length > 0 && <div className="card" style={{
      background: isPast4pm ? 'rgba(229,62,62,.08)' : 'rgba(245,158,11,.06)',
      border: `1px solid ${isPast4pm ? 'rgba(229,62,62,.25)' : 'rgba(245,158,11,.25)'}`,
      marginBottom:12
    }}>
      <div style={{fontWeight:700, color: isPast4pm ? 'var(--red)' : 'var(--amber)', marginBottom:8, fontSize:14}}>
        {isPast4pm ? '🔴' : '⚠'} Uncounted Dirty Linen Today ({uncounted.length})
      </div>
      <div style={{fontSize:12,color:'var(--text2)',marginBottom:8}}>
        These lodges checked out today but no dirty linen count has been submitted:
      </div>
      {uncounted.map(l => <div key={l} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
        <span style={{fontWeight:700,fontSize:14,color: isPast4pm ? 'var(--red)' : 'var(--amber)'}}>{l}</span>
        <button className="btn btn-ghost btn-sm" onClick={()=>deferLodge(l)}
          style={{fontSize:11}}>→ Defer to tomorrow</button>
      </div>)}
    </div>}

    {alerts.length > 0 && <div style={{marginBottom:8,fontSize:13,color:'var(--text2)'}}>{alerts.length} lodge(s) with missing items today</div>}
    {alerts.map(entry => <div key={entry.id} className="alert-box">
      <h3>⚠ {entry.lodge}</h3>
      {entry.shorts.map(item => {
        const missing = entry.expected[item]-entry.actual[item];
        return <div key={item} className="alert-row">
          <span><strong>{item}:</strong> expected {entry.expected[item]}, got {entry.actual[item]} — <span className="alert-missing">{missing} missing</span></span>
          <div style={{display:'flex',gap:6}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>markRetrieved(entry.id,item)}>✓ Retrieved</button>
            <button className="btn btn-ghost btn-sm" style={{color:'var(--accent)',borderColor:'var(--accent)'}}
              onClick={()=>returnToStock(entry.id,item)}>📦 Return to Stock</button>
          </div>
        </div>;
      })}
    </div>)}
  </>;
}

// ── STOCK TAB ─────────────────────────────────────────────────────────────────
function StockTab({shelf, saveShelf}) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState({});
  const [adminName, setAdminName] = useState('');
  const [showPin, setShowPin] = useState(false);
  const [pinInput, setPinInput] = useState('');
  const [pinError, setPinError] = useState(false);
  const [, force] = useState(0);

  const hasStock = Object.keys(shelf).filter(k=>!k.startsWith('_')).length>0;
  const admin = isAdmin();

  const startEdit = () => {
    const zeros = {};
    ITEMS.forEach(i => zeros[i] = 0);
    setDraft(zeros);
    setAdminName('');
    setEditing(true);
  };

  const saveStock = () => {
    if (!adminName.trim()) {
      alert('Please enter your name before saving.');
      return;
    }
    const newShelf = {...shelf};
    let totalAdded = 0;
    ITEMS.forEach(item => {
      const add = draft[item] || 0;
      if (add) {
        newShelf[item] = Math.max(0, (newShelf[item] || 0) + add);  // adds OR subtracts; never below 0
        totalAdded += add;
      }
    });
    newShelf._updated = new Date().toISOString();
    saveShelf(newShelf, 'stock_adjusted', {staffName: adminName.trim(), totalAdded, change: {...draft}, date: todayStr()});
    setEditing(false);
  };

  const tryPin = () => {
    if (pinInput === ADMIN_PIN) {
      setAdmin(true);
      setShowPin(false);
      setPinInput('');
      setPinError(false);
      force(n => n + 1);
    } else {
      setPinError(true);
      setPinInput('');
    }
  };

  const lockOut = () => { setAdmin(false); force(n => n + 1); };

  return <div className="card">
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12,flexWrap:'wrap',gap:8}}>
      <div className="card-title" style={{margin:0}}>Warehouse Shelf Stock</div>
      <div style={{display:'flex',gap:6}}>
        {admin && !editing && <button className="btn btn-ghost btn-sm" onClick={startEdit}>± Adjust Stock</button>}
        {admin && !editing && <button className="btn btn-ghost btn-sm" onClick={lockOut} title="Re-lock admin">🔒</button>}
        {!admin && !editing && <button className="btn btn-ghost btn-sm" style={{opacity:0.5,fontSize:11}} onClick={()=>{setShowPin(true);setPinError(false);}}>🔒 Admin</button>}
      </div>
    </div>

    {showPin && <div style={{background:'rgba(0,0,0,0.04)',padding:12,borderRadius:8,marginBottom:12}}>
      <div className="field-label" style={{marginBottom:4}}>Enter admin PIN</div>
      <input type="password" inputMode="numeric" maxLength="4" value={pinInput}
        onChange={e=>{setPinInput(e.target.value);setPinError(false);}}
        onKeyDown={e=>{ if(e.key==='Enter') tryPin(); }}
        style={{letterSpacing:'0.3em',textAlign:'center',fontSize:18}}/>
      {pinError && <div style={{color:'#c62828',fontSize:12,marginTop:4}}>Incorrect PIN</div>}
      <div className="btn-row" style={{marginTop:8}}>
        <button className="btn btn-ghost" onClick={()=>{setShowPin(false);setPinInput('');setPinError(false);}}>Cancel</button>
        <button className="btn btn-primary" onClick={tryPin}>Unlock</button>
      </div>
    </div>}

    {shelf._updated && <div style={{fontSize:12,color:'var(--text3)',marginBottom:12,fontFamily:'DM Mono,monospace'}}>Last updated: {fmtDate(shelf._updated)}</div>}

    {editing ? <>
      <div style={{background:'rgba(255,193,7,0.1)',borderLeft:'4px solid #f59e0b',padding:'8px 12px',borderRadius:6,marginBottom:12,fontSize:13}}>
        <strong>⚠️ Adjust Stock (admin only)</strong><br/>
        Use this only as a last resort. For routine GL deliveries, use the GL Flow tab.
        Enter positive numbers to ADD stock or negative numbers to REMOVE stock.
        The change is applied to the current shelf — not a replacement.
      </div>
      <div style={{marginBottom:12}}>
        <div className="field-label" style={{marginBottom:4}}>Your name (required)</div>
        <input type="text" value={adminName} onChange={e=>setAdminName(e.target.value)} placeholder="Your name"/>
      </div>
      <table className="tbl">
        <thead><tr><th>Item</th><th className="center">Adjust (±)</th><th className="center">Current → New</th></tr></thead>
        <tbody>{ITEMS.map(item => {
          const cur = shelf[item] || 0;
          const add = draft[item] || 0;
          const newVal = Math.max(0, cur + add);
          const color = !add ? 'var(--text3)' : add > 0 ? 'var(--green)' : '#c62828';
          return <tr key={item}>
            <td className="item-name">{item}</td>
            <td><div className="stepper">
              <button className="step-btn" onClick={()=>setDraft(p=>({...p,[item]:(p[item]||0)-1}))}>−</button>
              <input className="step-inp" type="number" value={draft[item]??0} onChange={e=>{
                const n = parseInt(e.target.value);
                setDraft(p=>({...p,[item]:isNaN(n)?0:n}));
              }}/>
              <button className="step-btn" onClick={()=>setDraft(p=>({...p,[item]:(p[item]||0)+1}))}>+</button>
            </div></td>
            <td className="center" style={{fontFamily:'DM Mono,monospace',fontSize:13,color}}>
              {cur}{add ? ` → ${newVal}` : ''}
            </td>
          </tr>;
        })}</tbody>
      </table>
      <div className="btn-row">
        <button className="btn btn-ghost" onClick={()=>setEditing(false)}>Cancel</button>
        <button className="btn btn-success" onClick={saveStock}>✓ Apply Adjustment</button>
      </div>
    </> : hasStock ? <div className="stock-grid">
      {ITEMS.map(item => { const v=shelf[item]??0; return <div key={item} className="stock-item">
        <div className="stock-label">{item}</div>
        <div className={`stock-val ${v===0?'low':v<10?'warn':'ok'}`}>{v}</div>
      </div>; })}
    </div> : <div className="empty"><div className="empty-icon">📦</div>No stock count yet<br/><br/>
      {admin ? <button className="btn btn-primary" onClick={startEdit}>Adjust Stock</button> : <div style={{fontSize:12,color:'var(--text3)'}}>Admin access required.</div>}
    </div>}
  </div>;
}

// ── GL FLOW TAB ───────────────────────────────────────────────────────────────
function GlFlowTab({glFlow, saveGlFlow, counts, watchList, saveWatch, shelf, saveShelf}) {
  const [view, setView] = useState('log');
  const [formDate, setFormDate] = useState(todayStr());
  const [formType, setFormType] = useState('collection');
  const [formData, setFormData] = useState({});
  const [formNotes, setFormNotes] = useState('');
  const [extras, setExtras] = useState({});
  const [staffName, setStaffName] = useState('');

  const autoFill = () => {
    const lastCol = glFlow.find(g=>g.type==='collection');
    const cutoff = lastCol ? lastCol.date : null;
    const relevant = cutoff
      ? counts.filter(c=>c.date>cutoff && c.date<=todayStr() && c.type!=='stockout')
      : counts.filter(c=>c.date<=todayStr() && c.type!=='stockout');

    // Transparency — show what will be included before filling
    const dates = [...new Set(relevant.map(c=>c.date))].sort();
    const lodges = [...new Set(relevant.map(c=>c.lodge))].sort();
    const msg = `Auto-fill will include counts from:\n\nDates: ${dates.join(', ')||'none'}\nLodges (${lodges.length}): ${lodges.join(', ')||'none'}\n\nCutoff: ${cutoff ? 'after '+cutoff : 'all dates'}\n\nProceed?`;
    if (!window.confirm(msg)) return;
    const totals={};
    // Only count each lodge once per date (most recent entry wins)
    const seen = new Set();
    relevant.forEach(entry => {
      const key = entry.lodge + '_' + entry.date;
      if (!seen.has(key)) {
        seen.add(key);
        ITEMS.forEach(item => {
          const v=entry.actual[item];
          if(v!=null) totals[item]=(totals[item]||0)+v;
        });
      }
    });
    setFormData(totals);
  };

  const saveEntry = () => {
    if (!staffName.trim()) {
      alert('Please enter your name before saving.');
      return;
    }
    let missing=[];
    if (formType==='delivery') {
      const lastCol=[...glFlow].find(g=>g.type==='collection');
      if (lastCol) ITEMS.forEach(item => {
        const sent=lastCol.data[item]||0, recv=formData[item]||0;
        if (recv<sent) missing.push({item,sent,received:recv,short:sent-recv});
      });
    }
    // Merge extras into collection data
    const finalData = {...formData};
    if (formType==='collection') {
      Object.keys(extras).forEach(item => {
        if ((extras[item]||0) > 0) finalData[item] = (finalData[item]||0) + extras[item];
      });
    }
    const entry={
      id:Date.now(),
      type:formType,
      date:formDate,
      data:finalData,
      extras:formType==='collection'?{...extras}:{},
      notes:formNotes,
      staffName:staffName.trim(),
      missing,
      ts:new Date().toISOString()
    };
    saveGlFlow([entry,...glFlow]);
    if (missing.length>0) {
      const watches=missing.map(m=>({...m,fromDate:formDate,id:Date.now()+Math.random(),resolved:false}));
      saveWatch([...watchList,...watches]);
    }
    // If delivery — automatically add quantities to warehouse shelf stock
    if (formType==='delivery') {
      const newShelf = {...shelf};
      const added = {};
      ITEMS.forEach(item => {
        if ((finalData[item]||0) > 0) {
          newShelf[item] = (newShelf[item]||0) + (finalData[item]||0);
          added[item] = finalData[item];
        }
      });
      newShelf._date = formDate;
      newShelf._updated = new Date().toISOString();
      saveShelf(newShelf, 'glflow_delivery', {date: formDate, staffName: staffName.trim(), added, notes: formNotes});
    } else {
      // Collection — doesn't change shelf, so write an audit entry directly
      supaAudit('glflow_collection', {date: formDate, staffName: staffName.trim(), data: finalData, extras: {...extras}, notes: formNotes});
    }
    setView('log'); setFormData({}); setFormNotes(''); setExtras({}); setStaffName('');
  };

  const unresolved = watchList.filter(w=>!w.resolved);

  const adj = (item,d) => setFormData(p=>({...p,[item]:Math.max(0,(p[item]||0)+d)}));

  if (view==='form') return <>
    <div className="card">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setView('log')}>← Back</button>
        <div style={{fontSize:16,fontWeight:700}}>{formType==='collection'?'📤 GL Collection':'📥 GL Delivery'}</div>
      </div>
      <div style={{marginBottom:12}}>
        <div className="field-label" style={{marginBottom:4}}>Date</div>
        <input type="date" value={formDate} onChange={e=>setFormDate(e.target.value)}/>
      </div>
      <div style={{marginBottom:12}}>
        <div className="field-label" style={{marginBottom:4}}>Your name (required)</div>
        <input type="text" placeholder="Your name" value={staffName} onChange={e=>setStaffName(e.target.value)}/>
      </div>
      {formType==='collection' && <button className="btn btn-ghost btn-full" style={{marginBottom:12}} onClick={autoFill}>⟳ Auto-fill from lodge counts</button>}
      <table className="tbl">
        <thead><tr><th>Item</th><th className="center">{formType==='collection'?'Sent to GL':'Received from GL'}</th></tr></thead>
        <tbody>{ITEMS.map(item => <tr key={item}>
          <td className="item-name">{item}</td>
          <td><div className="stepper">
            <button className="step-btn" onClick={()=>adj(item,-1)}>−</button>
            <input className="step-inp" type="number" min="0" value={formData[item]??0} onChange={e=>setFormData(p=>({...p,[item]:Math.max(0,parseInt(e.target.value)||0)}))}/>
            <button className="step-btn" onClick={()=>adj(item,1)}>+</button>
          </div></td>
        </tr>)}</tbody>
      </table>
      {formType==='collection' && <>
        <div style={{marginTop:12,borderTop:'1px solid var(--border)',paddingTop:12}}>
          <div className="card-title">Extras — Additional items being sent to GL</div>
          <div style={{fontSize:12,color:'var(--text2)',marginBottom:8}}>Items found after last clean, rejects or any additional linen not in the standard lodge count</div>
          <table className="tbl">
            <thead><tr><th>Item</th><th className="center">Extra Qty</th></tr></thead>
            <tbody>
              {ITEMS.map(item => (
                <tr key={item}>
                  <td className="item-name">{item}</td>
                  <td><div className="stepper">
                    <button className="step-btn" onClick={()=>setExtras(p=>({...p,[item]:Math.max(0,(p[item]||0)-1)}))}>−</button>
                    <input className="step-inp" type="number" min="0" value={extras[item]||0}
                      onChange={e=>setExtras(p=>({...p,[item]:Math.max(0,parseInt(e.target.value)||0)}))}/>
                    <button className="step-btn" onClick={()=>setExtras(p=>({...p,[item]:(p[item]||0)+1}))}>+</button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </>}
      <div style={{marginTop:12}}>
        <div className="field-label" style={{marginBottom:4}}>Notes</div>
        <input type="text" placeholder="Any notes..." value={formNotes} onChange={e=>setFormNotes(e.target.value)}/>
      </div>
      <div className="btn-row">
        <button className="btn btn-ghost" onClick={()=>{setView('log');setStaffName('');}}>Cancel</button>
        <button className="btn btn-primary" onClick={saveEntry}>✓ Save Record</button>
      </div>
    </div>
  </>;

  return <>
    <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
      <button className="btn btn-ghost" style={{flex:1}} onClick={()=>{setFormType('collection');setView('form');}}>📤 New Collection</button>
      <button className="btn btn-primary" style={{flex:1}} onClick={()=>{setFormType('delivery');setView('form');}}>📥 New Delivery</button>
      <button className="btn btn-sm" style={{background:'rgba(229,62,62,.1)',color:'var(--red)',border:'1px solid rgba(229,62,62,.3)'}}
        onClick={()=>{ if(window.confirm('Clear all GL Flow records?')) { saveGlFlow([]); saveWatch([]); } }}>🗑 Clear</button>
    </div>
    {unresolved.length>0 && <div className="watch-box">
      <div style={{fontWeight:700,color:'var(--amber)',marginBottom:8}}>⚠ Watch List — Items Still Owed by GL</div>
      {unresolved.map(w => <div key={w.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderBottom:'1px solid rgba(217,119,6,.2)'}}>
        <div>
          <div style={{fontWeight:600,fontSize:13}}>{w.item} <span className="c-red mono">−{w.short}</span></div>
          <div style={{fontSize:11,color:'var(--text3)'}}>From delivery {fmtDate(w.fromDate)} · sent {w.sent}, received {w.received}</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={()=>saveWatch(watchList.map(x=>x.id===w.id?{...x,resolved:true}:x))}>✓ Received</button>
      </div>)}
    </div>}
    {!glFlow.length ? <div className="empty"><div className="empty-icon">🔄</div>No GL records yet</div>
    : glFlow.slice(0,20).map(entry => {
      const lastCol = entry.type==='delivery' ? glFlow.find(g=>g.type==='collection'&&g.date<entry.date) : null;
      return <div key={entry.id} className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div>
            <div style={{fontWeight:700,fontSize:15}}>{entry.type==='collection'?'📤 GL Collection':'📥 GL Delivery'}</div>
            <div style={{fontSize:12,color:'var(--text3)',fontFamily:'DM Mono,monospace'}}>{fmtDate(entry.date)}{entry.staffName && <span style={{marginLeft:8,color:'var(--text3)',fontSize:11}}>by {entry.staffName}</span>}</div>
          </div>
          {entry.missing?.length>0 && <span className="chip chip-short">⚠ Short</span>}
        </div>
        <table className="tbl">
          <thead><tr>
            <th>Item</th>
            <th className="center">{entry.type==='collection'?'Sent':'Received'}</th>
            {lastCol && <th className="center">Was Sent</th>}
            {lastCol && <th className="center">Diff</th>}
          </tr></thead>
          <tbody>{ITEMS.filter(i=>(entry.data[i]||0)>0||(lastCol&&(lastCol.data[i]||0)>0)).map(item => {
            const val=entry.data[item]||0, sent=lastCol?lastCol.data[item]||0:null;
            const diff=sent!==null?val-sent:null;
            return <tr key={item}>
              <td className="item-name">{item}</td>
              <td className="center mono">{val||'—'}</td>
              {lastCol && <td className="center mono c-muted">{sent||'—'}</td>}
              {lastCol && <td className="center mono">
                {diff===null?'—':diff<0?<span className="c-red">▼{Math.abs(diff)}</span>
                  :diff>0?<span className="c-amber">▲{diff}</span>:diff===0?<span className="c-green">✓</span>:'—'}
              </td>}
            </tr>;
          })}</tbody>
        </table>
        {entry.notes && <div style={{marginTop:8,fontSize:12,color:'var(--text2)',fontStyle:'italic'}}>Note: {entry.notes}</div>}
      </div>;
    })}
  </>;
}

// ── FORECAST TAB ──────────────────────────────────────────────────────────────
function ForecastTab({shelf, lodges, season, saveSeason, glFlow}) {
  const [fcData, setFcData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const GL_DAYS = {high:[1,3,5], low:[1,4]};
  const isGlDay = d => GL_DAYS[season].includes(new Date(d+'T12:00:00').getDay());

  const buildForecast = (checkouts) => {
    // "Expected delivery" = most recent collection ONLY if no delivery has been
    // logged since that collection. Once GL delivers it back, the collection is
    // "matched" — we don't expect another delivery until a new collection happens.
    // Uses ts (insert timestamp) for comparison so a same-day collection+delivery
    // pair compares correctly by insertion order.
    let glExpected = null;        // null = TBD (no outstanding collection)
    let glExpectedFrom = null;     // date of the collection driving the estimate
    if (Array.isArray(glFlow) && glFlow.length) {
      const lastCollection = glFlow.find(g => g.type === 'collection');
      const lastDelivery   = glFlow.find(g => g.type === 'delivery');
      if (lastCollection) {
        const collKey = lastCollection.ts || lastCollection.date || '';
        const delvKey = lastDelivery ? (lastDelivery.ts || lastDelivery.date || '') : '';
        // Collection is "outstanding" only if logged AFTER the most recent delivery
        if (!lastDelivery || collKey > delvKey) {
          glExpected = lastCollection.data || {};
          glExpectedFrom = lastCollection.date;
        }
      }
    }

    const days=[];
    let runningShelf = {...shelf};

    for (let i=1;i<8;i++) {  // Start from tomorrow (i=1)
      const d=new Date(); d.setDate(d.getDate()+i);
      const dateStr=d.toISOString().split('T')[0];
      const lodgeList=(checkouts[dateStr]||[]).filter(l=>!EXCLUDED.has(l)&&lodges[l]);
      const totals={};
      lodgeList.forEach(l => ITEMS.forEach(item => { totals[item]=(totals[item]||0)+(lodges[l][item]||0); }));
      const glDay = isGlDay(dateStr);

      // Capture shelf before any changes this day
      const shelfBefore = {...runningShelf};

      // GL delivery arrives late afternoon — available for cleans from NEXT day
      // So add GL delivery AFTER deducting today's cleans
      const shelfWithGL = {...shelfBefore}; // for display purposes only

      // Deduct linen going out to get shelf after
      const shelfAfter = {};
      ITEMS.forEach(item => {
        shelfAfter[item] = (shelfBefore[item]||0) - (totals[item]||0);
      });

      // Add GL delivery to carry forward (available from tomorrow) — but ONLY if we
      // have an outstanding collection. If glExpected is null, it's TBD.
      // Only the FIRST GL day in the window gets the expected delivery applied —
      // subsequent GL days are TBD because we won't know what's coming until a
      // new collection happens.
      const applyHere = glDay && glExpected && !days.some(p => p.isGl && p.glDelivery);
      if (applyHere) {
        ITEMS.forEach(item => {
          shelfAfter[item] = (shelfAfter[item]||0) + (glExpected[item]||0);
          shelfWithGL[item] = (shelfBefore[item]||0) + (glExpected[item]||0); // display only
        });
      }

      // Carry forward for next day
      runningShelf = {...shelfAfter};

      days.push({date:dateStr, lodges:lodgeList, totals, isGl:glDay,
                 glDelivery: applyHere ? glExpected : null,
                 glExpectedFrom: applyHere ? glExpectedFrom : null,
                 glTbd: glDay && !applyHere,
                 shelfBefore, shelfWithGL, shelfAfter});
    }
    setFcData(days);
  };

  const GITHUB_JSON_URL = 'https://raw.githubusercontent.com/CotsRet/gl-linen/main/checkouts.json';

  const fetchForecast = async () => {
    setLoading(true); setError('');
    try {
      const resp = await fetch(GITHUB_JSON_URL + '?t=' + Date.now());
      if (!resp.ok) throw new Error('File not found');
      const data = await resp.json();
      const generated = data._generated ? new Date(data._generated).toLocaleString('en-GB') : 'unknown';
      console.log('checkouts.json loaded, generated:', generated);
      buildForecast(data);
    } catch(e) {
      setError('Could not load forecast data. Make sure beds24_report.py has run recently and checkouts.json is on GitHub.');
      console.error(e);
    }
    setLoading(false);
  };

  return <>
    <div className="card">
      <div className="card-title">GL Schedule</div>
      <div className="season-row">
        <div className={`season-btn${season==='high'?' on':''}`} onClick={()=>saveSeason('high')}>
          High Season<br/><span style={{fontSize:11,opacity:.7}}>Mon · Wed · Fri</span>
        </div>
        <div className={`season-btn${season==='low'?' on':''}`} onClick={()=>saveSeason('low')}>
          Low Season<br/><span style={{fontSize:11,opacity:.7}}>Mon · Thu</span>
        </div>
      </div>
      <button className="btn btn-primary btn-full" onClick={fetchForecast} disabled={loading}>
        {loading?'⟳ Loading forecast...':'⟳ Load 7-Day Forecast'}
      </button>
      {error && <div style={{color:'var(--red)',fontSize:13,marginTop:8}}>{error}</div>}
    </div>
    {!fcData && !loading && <div className="empty"><div className="empty-icon">📅</div>Press Load to fetch live checkout data</div>}
    {fcData && fcData.map(day => {
      const items=ITEMS.filter(i=>(day.totals[i]||0)>0);
      return <div key={day.date} className="fc-day" style={day.isGl?{border:'1px solid rgba(45,158,95,.4)'}:{}}>
        <div className="fc-day-header">
          <div>
            <div className="fc-day-name">{getDayName(day.date)}</div>
            <div className="fc-day-date">{fmtDate(day.date)} · {day.lodges.length} GL lodges</div>
          </div>
          {day.isGl && <div className="fc-gl-badge">GL Day</div>}
        </div>
        {day.isGl && day.glDelivery && Object.values(day.glDelivery).some(v=>v>0) && (
        <div style={{background:'rgba(45,158,95,.08)',border:'1px solid rgba(45,158,95,.2)',borderRadius:'8px',padding:'8px 10px',marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--accent)',marginBottom:4,textTransform:'uppercase',letterSpacing:'.5px'}}>
            Expected GL Delivery
            {day.glExpectedFrom && <span style={{fontWeight:500,opacity:.75,marginLeft:6,textTransform:'none',letterSpacing:0}}>
              · based on collection {fmtDate(day.glExpectedFrom)}
            </span>}
          </div>
          <div style={{fontSize:12,color:'var(--text2)',display:'flex',flexWrap:'wrap',gap:'4px 16px'}}>
            {ITEMS.filter(i=>(day.glDelivery[i]||0)>0).map(i=>(
              <span key={i}>{i}: <span style={{fontWeight:700,color:'var(--accent)'}}>{day.glDelivery[i]}</span></span>
            ))}
          </div>
        </div>
      )}
      {day.glTbd && (
        <div style={{background:'rgba(127,127,127,.06)',border:'1px solid rgba(127,127,127,.2)',borderRadius:'8px',padding:'8px 10px',marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',marginBottom:4,textTransform:'uppercase',letterSpacing:'.5px'}}>
            GL Delivery — TBD
          </div>
          <div style={{fontSize:12,color:'var(--text3)'}}>
            No outstanding collection — quantities unknown until the next dirty bag goes to GL.
          </div>
        </div>
      )}
      {!items.length ? <div style={{color:'var(--text3)',fontSize:13}}>No GL cleans</div>
        : items.map(item => {
          const need=day.totals[item]||0;
          const have = day.shelfBefore[item]||0; // GL delivery not available until next day
          const after=day.shelfAfter[item]||0;
          const ok=have>=need;
          return <div key={item} className="fc-item-row">
            <div className="fc-item-name">{item}</div>
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
              <div className="fc-item-shelf c-muted">available: {have}</div>
              <div className={`fc-item-need ${ok?'c-green':'c-red'}`}>need: {need}</div>
              <div style={{fontSize:11,color:'var(--text3)'}}>after: {after}</div>
              {!ok && <span className="chip chip-short">▼{need-have}</span>}
            </div>
          </div>;
        })}
      </div>;
    })}
  </>;
}


// ── WEEKLY SUMMARY TAB ───────────────────────────────────────────────────────
function WeeklySummaryTab({counts, lodges, glFlow}) {
  const [expanded, setExpanded] = useState(null);

  const ITEMS = ['Bath Sheet','Bath Mat','Hand Towel','S King D','S King S',
                 'King D','King S','Single D','Single S','Pillow C','Oxford','Tea Towel'];

  // Build last 7 days
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().split('T')[0]);
  }

  // Build summary for each day — simple view, just what came in
  const summaries = days.map(date => {
    const dayCounts     = counts.filter(c => c.date === date && c.type !== 'stockout');
    const dayOuts       = counts.filter(c => c.date === date && c.type === 'stockout');
    const countedLodges = dayCounts.map(c => c.lodge);

    // Tally actual pieces counted in
    const actual = {};
    ITEMS.forEach(i => { actual[i] = 0; });
    dayCounts.forEach(c => {
      ITEMS.forEach(item => {
        if (c.actual && c.actual[item]) actual[item] += c.actual[item];
      });
    });

    const totalActual = Object.values(actual).reduce((s,v)=>s+v,0);
    const bsActual    = actual['Bath Sheet'] || 0;

    return {date, dayCounts, dayOuts, countedLodges,
            actual, totalActual, bsActual};
  });

  const fmtDay = date => {
    const d = new Date(date + 'T12:00:00');
    return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  };

  return <>
    <div className="card" style={{marginBottom:8}}>
      <div className="card-title">7 Day Summary</div>
      <div style={{fontSize:12,color:'var(--text2)'}}>Tap a day to expand details</div>
    </div>

    {summaries.map(s => {
      const isExpanded = expanded === s.date;
      const isToday = s.date === todayStr();
      const bsColor = s.bsDiff < 0 ? 'var(--red)' : s.bsDiff > 0 ? 'var(--amber)' : 'var(--green)';

      return <div key={s.date} className="card" style={{
        marginBottom:8,
        borderLeft: `4px solid ${s.totalActual===0 ? 'var(--border)' : 'var(--green)'}`,
        background: isToday ? 'rgba(72,199,142,.04)' : 'var(--surf)'
      }}>
        {/* Header row */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}
