          onClick={()=>setExpanded(isExpanded ? null : s.date)}>
          <div>
            <div style={{fontWeight:700,fontSize:15}}>{fmtDay(s.date)}{isToday?' (Today)':''}</div>
            <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>
              {s.dayOuts.length} deliveries out · {s.countedLodges.length} bags counted in
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:22,fontWeight:900,fontFamily:'DM Mono,monospace',color:'var(--accent)'}}>
              {s.bsActual}<span style={{fontSize:12,color:'var(--text3)'}}> BS in</span>
            </div>
            <div style={{fontSize:11,color:'var(--text3)'}}>{isExpanded?'▲ collapse':'▼ expand'}</div>
          </div>
        </div>

        {/* Expanded detail */}
        {isExpanded && <>
          {/* Linen counted in table */}
          {s.totalActual > 0 && <table className="tbl" style={{marginTop:10}}>
            <thead>
              <tr>
                <th>Item</th>
                <th className="center">Counted In</th>
              </tr>
            </thead>
            <tbody>
              {ITEMS.filter(item => s.actual[item]>0).map(item => {
                const isBs = item === 'Bath Sheet';
                return <tr key={item} style={{background: isBs ? 'rgba(72,199,142,.04)' : ''}}>
                  <td className="item-name" style={{fontWeight: isBs ? 700 : 400}}>{item}</td>
                  <td className="center mono" style={{fontWeight: isBs ? 700 : 400}}>{s.actual[item]}</td>
                </tr>;
              })}
              <tr style={{borderTop:'2px solid var(--border)'}}>
                <td className="item-name" style={{fontWeight:700}}>Total</td>
                <td className="center mono" style={{fontWeight:700}}>{s.totalActual}</td>
              </tr>
            </tbody>
          </table>}

          {/* Counted lodges */}
          {s.countedLodges.length > 0 && <div style={{marginTop:10,fontSize:12,color:'var(--text2)'}}>
            <span style={{fontWeight:700,color:'var(--green)'}}>✓ Lodges: </span>
            {s.countedLodges.join(', ')}
          </div>}

          {s.totalActual === 0 &&
            <div style={{textAlign:'center',padding:'16px',fontSize:12,color:'var(--text3)'}}>No bags counted in this day</div>}
        </>}
      </div>;
    })}
  </>;
}

// ── HISTORY TAB ───────────────────────────────────────────────────────────────
function HistoryTab({counts, saveCounts, shelf, saveShelf, lodges}) {
  const [filter, setFilter] = useState('all');
  const [dateFilter, setDateFilter] = useState('');
  const [editEntry, setEditEntry] = useState(null);
  const [editData, setEditData] = useState({});

  const filtered = counts.filter(c => {
    if (c.type === 'stockout') {
      if (dateFilter && c.date !== dateFilter) return false;
      return filter === 'all';
    }
    if (dateFilter && c.date !== dateFilter) return false;
    if (filter==='short') return c.hasShort;
    if (filter==='over') return c.hasOver&&!c.hasShort;
    if (filter==='ok') return !c.hasShort&&!c.hasOver;
    return true;
  });

  const saveEdit = () => {
    const expected=editEntry.expected, shorts=[], overs=[];
    ITEMS.forEach(item => {
      const exp=expected[item]||0, act=editData[item];
      if (act!=null&&exp>0) { if(act<exp) shorts.push(item); if(act>exp) overs.push(item); }
    });
    saveCounts(counts.map(c=>c.id===editEntry.id?{...c,actual:{...editData},shorts,overs,hasShort:shorts.length>0,hasOver:overs.length>0}:c));
    setEditEntry(null);
  };

  return <>
    {editEntry && <div className="modal-bg" onClick={()=>setEditEntry(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Edit: {editEntry.lodge} — {fmtDate(editEntry.date)}</div>
        <table className="tbl">
          <thead><tr><th>Item</th>{editEntry.expected ? <th className="center">Expected</th> : null}<th className="center">Actual</th></tr></thead>
          <tbody>{ITEMS.filter(i=>((editEntry.expected||{})[i]||0)>0||(editEntry.actual||{})[i]>0).map(item => <tr key={item}>
            <td className="item-name">{item}</td>
            {editEntry.expected ? <td className="center exp-val">{(editEntry.expected||{})[item]||0}</td> : null}
            <td><div className="stepper">
              <button className="step-btn" onClick={()=>setEditData(p=>({...p,[item]:Math.max(0,(p[item]||0)-1)}))}>−</button>
              <input className="step-inp" type="number" min="0" value={editData[item]??0} onChange={e=>setEditData(p=>({...p,[item]:Math.max(0,parseInt(e.target.value)||0)}))}/>
              <button className="step-btn" onClick={()=>setEditData(p=>({...p,[item]:(p[item]||0)+1}))}>+</button>
            </div></td>
          </tr>)}</tbody>
        </table>
        <div className="btn-row" style={{marginTop:16}}>
          <button className="btn btn-ghost" onClick={()=>setEditEntry(null)}>Cancel</button>
          <button className="btn btn-primary" onClick={saveEdit}>Save Changes</button>
        </div>
      </div>
    </div>}
    <div style={{display:'flex',gap:6,marginBottom:8,flexWrap:'wrap',justifyContent:'space-between',alignItems:'center'}}>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {[['all','All'],['short','⚠ Short'],['over','↑ Over'],['ok','✓ OK']].map(([v,l]) =>
          <button key={v} className={`btn btn-sm ${filter===v?'btn-primary':'btn-ghost'}`} onClick={()=>setFilter(v)}>{l}</button>
        )}
      </div>
      <button className="btn btn-sm" style={{background:'rgba(229,62,62,.1)',color:'var(--red)',border:'1px solid rgba(229,62,62,.3)'}}
        onClick={()=>{ if(window.confirm('Clear all count history? This cannot be undone.')) saveCounts([]); }}>🗑 Clear All</button>
    </div>
    <div style={{display:'flex',gap:8,marginBottom:12,alignItems:'center'}}>
      <div className="field-label" style={{whiteSpace:'nowrap'}}>Date</div>
      <input type="date" value={dateFilter} onChange={e=>setDateFilter(e.target.value)}
        style={{flex:1,padding:'6px 10px',fontSize:13}}/>
      {dateFilter && <button className="btn btn-ghost btn-sm" onClick={()=>setDateFilter('')}>✕ Clear</button>}
    </div>
    {!filtered.length ? <div className="empty"><div className="empty-icon">📋</div>No counts recorded yet</div>
    : filtered.map(entry => {
      const isStockOut = entry.type === 'stockout';
      const color = isStockOut ? 'var(--accent)' : entry.hasShort?'var(--red)':entry.hasOver?'var(--amber)':'var(--green)';
      const icon  = isStockOut ? '📤' : entry.hasShort?'⚠':entry.hasOver?'↑':'✓';
      return <div key={entry.id} className="hist-item" style={entry.returnedUnused ? {opacity:.6} : {}}>
        <div className="hist-header">
          <div>
            <div className="hist-lodge" style={{color}}>{icon} {entry.lodge}
              {entry.returnedUnused && <span style={{marginLeft:8,padding:'2px 8px',fontSize:10,fontWeight:700,letterSpacing:'.5px',background:'rgba(127,127,127,.15)',color:'var(--text2)',border:'1px solid rgba(127,127,127,.3)',borderRadius:10}}>↩ RETURNED</span>}
            </div>
            <div className="hist-date">{fmtDate(entry.date)}</div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            {isStockOut && !entry.returnedUnused && (
              <span className="edit-link" style={{color:'var(--text2)'}}
                onClick={()=>{
                  if (!window.confirm(`Mark ${entry.lodge} delivery as returned unused?\n\nThe linen will be added back to the warehouse shelf and no bag-in will be expected for this lodge today.\n\nThis cannot be undone from the app.`)) return;
                  // Reverse the shelf delta: add items back
                  const newShelf = {...shelf};
                  ITEMS.forEach(item => {
                    const qty = (entry.actual || entry.qty || {})[item] || 0;
                    if (qty > 0) newShelf[item] = (newShelf[item] || 0) + qty;
                  });
                  saveShelf(newShelf, 'delivery_returned_unused', {
                    lodge: entry.lodge, date: entry.date,
                    qtyReturned: {...(entry.actual || entry.qty || {})},
                    originalStockoutId: entry.id, staffName: ''
                  });
                  // Mark the entry as returned
                  saveCounts(counts.map(c => c.id === entry.id ? {...c, returnedUnused: true, returnedAt: new Date().toISOString()} : c));
                }}>↩ Return Unused</span>
            )}
            {!entry.returnedUnused && <span className="edit-link" onClick={()=>{setEditEntry(entry);setEditData({...entry.actual});}}>Edit</span>}
          </div>
        </div>
        <div className="hist-items">
          {entry.type==='stockout'
            ? ITEMS.filter(i=>(entry.actual[i]||0)>0).map(item => (
                <span key={item} style={{marginRight:12}}>
                  {item}: <span className="mono c-blue">{entry.actual[item]}</span>
                </span>
              ))
            : ITEMS.filter(i=>(entry.expected[i]||0)>0).map(item => {
                const exp=entry.expected[item],act=entry.actual[item],diff=act!=null?act-exp:null;
                const isShort=diff!==null&&diff<0;
                const missing=isShort?Math.abs(diff):0;
                return <span key={item} style={{marginRight:12,display:'inline-flex',alignItems:'center',gap:4}}>
                  {item}: <span className="mono">{act??'?'}/{exp}</span>
                  {diff!==null&&diff<0&&<span className="c-red mono"> ▼{Math.abs(diff)}</span>}
                  {diff!==null&&diff>0&&<span className="c-amber mono"> ▲{diff}</span>}
                  {isShort&&<button className="btn btn-ghost btn-sm" style={{fontSize:9,padding:'1px 6px',color:'var(--accent)',borderColor:'var(--accent)'}}
                    onClick={()=>{
                      saveShelf({...shelf, [item]:Math.max(0,(shelf[item]||0)+missing)}, 'short_returned_to_stock', {lodge: entry.lodge, item, missing, source: 'history_tab'});
                      saveCounts(counts.map(c=>{
                        if(c.id!==entry.id) return c;
                        const actual={...c.actual,[item]:(c.actual[item]||0)+missing};
                        const shorts=(c.shorts||[]).filter(s=>s!==item);
                        return {...c,actual,shorts,hasShort:shorts.length>0};
                      }));
                    }}>📦+{missing}</button>}
                </span>;
              })
          }
        </div>
      </div>;
    })}
  </>;
}


// ── LODGE STOCK TAB ───────────────────────────────────────────────────────────
function LodgeStockTab({lodges, lodgeStatus, saveLodgeStatus, pendingReturns, savePendingReturns, shelf, saveShelf}) {
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [form, setForm] = useState({status:'short', items:{}, comment:'', useOwnLinen:false});
  const [pendingForm, setPendingForm] = useState({lodge:'', items:{}, comment:''});
  const [view, setView] = useState('list'); // list | edit | pending

  const lodgeNames = Object.keys(lodges).sort();
  const filtered = lodgeNames.filter(l => l.toLowerCase().includes(search.toLowerCase()));

  const getStatus = lodge => lodgeStatus[lodge] || {status:'full'};

  const statusChip = (status) => {
    if (status==='full')    return <span className="lodge-status-chip ls-full">✓ Full</span>;
    if (status==='short')   return <span className="lodge-status-chip ls-short">⚠ Short</span>;
    if (status==='own')     return <span className="lodge-status-chip ls-own">🔄 Own Linen</span>;
    return <span className="lodge-status-chip ls-unknown">— Unknown</span>;
  };

  const openEdit = lodge => {
    const s = getStatus(lodge);
    setSelected(lodge);
    setForm({
      status: s.status || 'full',
      items: s.items || {},
      comment: s.comment || '',
      useOwnLinen: s.useOwnLinen || false
    });
    setView('edit');
  };

  const saveStatus = () => {
    const updated = {...lodgeStatus, [selected]: {
      ...form,
      updatedAt: new Date().toISOString()
    }};
    saveLodgeStatus(updated);
    setView('list');
  };

  const clearStatus = lodge => {
    const updated = {...lodgeStatus, [lodge]: {status:'full', updatedAt: new Date().toISOString()}};
    saveLodgeStatus(updated);
  };

  const addPending = () => {
    if (!pendingForm.lodge) return;
    const entry = {
      id: Date.now(),
      lodge: pendingForm.lodge,
      items: {...pendingForm.items},
      comment: pendingForm.comment,
      date: todayStr(),
      ts: new Date().toISOString()
    };
    savePendingReturns([entry, ...pendingReturns]);
    setPendingForm({lodge:'', items:{}, comment:''});
    setView('list');
  };

  const receivePending = (id) => {
    const entry = pendingReturns.find(p => p.id === id);
    if (!entry) return;
    // Add items to shelf stock
    const newShelf = {...shelf};
    Object.keys(entry.items).forEach(item => {
      newShelf[item] = (newShelf[item] || 0) + (entry.items[item] || 0);
    });
    saveShelf(newShelf, 'pending_return_received', {lodge: entry.lodge, items: entry.items, comment: entry.comment});
    savePendingReturns(pendingReturns.filter(p => p.id !== id));
  };

  const shortLodges = lodgeNames.filter(l => {
    const s = getStatus(l);
    return s.status === 'short' || s.status === 'own' || s.status === 'unknown';
  });

  if (view === 'edit') return (
    <div className="card">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setView('list')}>← Back</button>
        <div style={{fontSize:16,fontWeight:700}}>{selected} — Stock Status</div>
      </div>

      <div style={{marginBottom:12}}>
        <div className="card-title">Status</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {[['full','✓ Full'],['short','⚠ Short'],['own','🔄 Own Linen Used'],['unknown','— Unknown']].map(([v,l]) =>
            <button key={v} className={`btn btn-sm ${form.status===v?'btn-primary':'btn-ghost'}`}
              onClick={()=>setForm(p=>({...p,status:v}))}>{l}</button>
          )}
        </div>
      </div>

      {(form.status==='short'||form.status==='own') && <>
        <div className="card-title" style={{marginTop:12}}>Missing Items</div>
        <table className="tbl">
          <thead><tr><th>Item</th><th className="center">Expected</th><th className="center">Missing</th></tr></thead>
          <tbody>
            {ITEMS.filter(i=>(lodges[selected]&&lodges[selected][i]||0)>0).map(item => {
              const exp = lodges[selected][item]||0;
              return <tr key={item}>
                <td className="item-name">{item}</td>
                <td className="center exp-val">{exp}</td>
                <td><div className="stepper">
                  <button className="step-btn" onClick={()=>setForm(p=>({...p,items:{...p.items,[item]:Math.max(0,(p.items[item]||0)-1)}}))}>−</button>
                  <input className="step-inp" type="number" min="0" value={form.items[item]||0}
                    onChange={e=>setForm(p=>({...p,items:{...p.items,[item]:Math.max(0,parseInt(e.target.value)||0)}}))}/>
                  <button className="step-btn" onClick={()=>setForm(p=>({...p,items:{...p.items,[item]:(p.items[item]||0)+1}}))}>+</button>
                </div></td>
              </tr>;
            })}
          </tbody>
        </table>
        {form.status==='own' && <div style={{marginTop:8}}>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--text2)',cursor:'pointer'}}>
            <input type="checkbox" checked={form.useOwnLinen}
              onChange={e=>setForm(p=>({...p,useOwnLinen:e.target.checked}))}/>
            Topped up with own linen
          </label>
        </div>}
      </>}

      <div style={{marginTop:12}}>
        <div className="card-title">Comment</div>
        <input type="text" placeholder="e.g. bed not used, items coming back next visit..."
          value={form.comment} onChange={e=>setForm(p=>({...p,comment:e.target.value}))}/>
      </div>

      <div className="btn-row">
        <button className="btn btn-ghost" onClick={()=>setView('list')}>Cancel</button>
        <button className="btn btn-primary" onClick={saveStatus}>✓ Save Status</button>
      </div>
    </div>
  );

  if (view === 'pending') return (
    <div className="card">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setView('list')}>← Back</button>
        <div style={{fontSize:16,fontWeight:700}}>Log Pending Return</div>
      </div>
      <div style={{marginBottom:12}}>
        <div className="card-title">Lodge</div>
        <select value={pendingForm.lodge} onChange={e=>setPendingForm(p=>({...p,lodge:e.target.value}))}>
          <option value="">Select lodge...</option>
          {lodgeNames.map(l => <option key={l} value={l}>{l}</option>)}
        </select>
      </div>
      {pendingForm.lodge && <>
        <div className="card-title">Items Coming Back (do not count yet)</div>
        <table className="tbl">
          <thead><tr><th>Item</th><th className="center">Qty</th></tr></thead>
          <tbody>
            {ITEMS.filter(i=>(lodges[pendingForm.lodge]&&lodges[pendingForm.lodge][i]||0)>0).map(item => (
              <tr key={item}>
                <td className="item-name">{item}</td>
                <td><div className="stepper">
                  <button className="step-btn" onClick={()=>setPendingForm(p=>({...p,items:{...p.items,[item]:Math.max(0,(p.items[item]||0)-1)}}))}>−</button>
                  <input className="step-inp" type="number" min="0" value={pendingForm.items[item]||0}
                    onChange={e=>setPendingForm(p=>({...p,items:{...p.items,[item]:Math.max(0,parseInt(e.target.value)||0)}}))}/>
                  <button className="step-btn" onClick={()=>setPendingForm(p=>({...p,items:{...p.items,[item]:(p.items[item]||0)+1}}))}>+</button>
                </div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </>}
      <div style={{marginTop:12}}>
        <div className="card-title">Comment</div>
        <input type="text" placeholder="e.g. found after clean, bed not used..."
          value={pendingForm.comment} onChange={e=>setPendingForm(p=>({...p,comment:e.target.value}))}/>
      </div>
      <div className="btn-row">
        <button className="btn btn-ghost" onClick={()=>setView('list')}>Cancel</button>
        <button className="btn btn-primary" onClick={addPending}>✓ Log Pending Return</button>
      </div>
    </div>
  );

  return <>
    {shortLodges.length > 0 && <div className="card" style={{background:'rgba(229,62,62,.05)',border:'1px solid rgba(229,62,62,.2)'}}>
      <div className="card-title" style={{color:'var(--red)'}}>⚠ Lodges with Stock Issues ({shortLodges.length})</div>
      {shortLodges.map(lodge => {
        const s = getStatus(lodge);
        const missingItems = Object.keys(s.items||{}).filter(i=>(s.items[i]||0)>0);
        return <div key={lodge} style={{padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>{lodge} {statusChip(s.status)}</div>
              {missingItems.length>0 && <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>
                Missing: {missingItems.map(i=>`${s.items[i]} ${i}`).join(', ')}
              </div>}
              {s.comment && <div style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',marginTop:2}}>{s.comment}</div>}
            </div>
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>openEdit(lodge)}>Edit</button>
              <button className="btn btn-success btn-sm" onClick={()=>clearStatus(lodge)}>✓ Clear</button>
            </div>
          </div>
        </div>;
      })}
    </div>}

    {pendingReturns.length > 0 && <div className="card" style={{background:'rgba(79,124,255,.05)',border:'1px solid rgba(79,124,255,.2)'}}>
      <div className="card-title" style={{color:'var(--accent)'}}>📦 Pending Returns ({pendingReturns.length})</div>
      {pendingReturns.map(entry => {
        const items = Object.keys(entry.items).filter(i=>(entry.items[i]||0)>0);
        return <div key={entry.id} style={{padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>{entry.lodge} <span style={{fontSize:11,color:'var(--text3)',fontFamily:'DM Mono,monospace'}}>{fmtDate(entry.date)}</span></div>
              <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>{items.map(i=>`${entry.items[i]} ${i}`).join(', ')}</div>
              {entry.comment && <div style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',marginTop:2}}>{entry.comment}</div>}
            </div>
            <button className="btn btn-success btn-sm" onClick={()=>receivePending(entry.id)}>✓ Received</button>
          </div>
        </div>;
      })}
    </div>}

    <div className="btn-row" style={{marginBottom:12}}>
      <button className="btn btn-ghost" onClick={()=>setView('pending')}>📦 Log Pending Return</button>
    </div>

    <div className="card">
      <div className="card-title">All Lodges</div>
      <input className="lodge-search" type="text" placeholder="Search lodge..." value={search}
        onChange={e=>setSearch(e.target.value)}/>
      {filtered.map(lodge => {
        const s = getStatus(lodge);
        const missingItems = Object.keys(s.items||{}).filter(i=>(s.items[i]||0)>0);
        return <div key={lodge} style={{display:'flex',justifyContent:'space-between',alignItems:'center',
          padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
          <div>
            <div style={{fontWeight:600,fontSize:13}}>{lodge} {statusChip(s.status)}</div>
            {missingItems.length>0 && <div style={{fontSize:11,color:'var(--red)',marginTop:2}}>
              {missingItems.map(i=>`${s.items[i]} ${i}`).join(', ')} missing
            </div>}
            {s.comment && <div style={{fontSize:11,color:'var(--text3)',fontStyle:'italic',marginTop:2}}>{s.comment}</div>}
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>openEdit(lodge)}>Edit</button>
        </div>;
      })}
    </div>
  </>;
}


// ── GL SUMMARY TAB ────────────────────────────────────────────────────────────
function GlSummaryTab({glFlow, watchList}) {
  const ITEMS = ['Bath Sheet','Bath Mat','Hand Towel','S King D','S King S',
                 'King D','King S','Single D','Single S','Pillow C','Oxford','Tea Towel'];

  // Find last collection and last delivery
  const lastCollection = glFlow.find(g => g.type === 'collection');
  const lastDelivery   = [...glFlow].filter(g=>g.type==='delivery').sort((a,b)=>b.date>a.date?1:-1)[0];
  const lastDeliveryDate = lastDelivery ? lastDelivery.date : null;

  // Calculate totals
  const totalCollected = {}, totalDelivered = {};
  glFlow.forEach(entry => {
    ITEMS.forEach(item => {
      if (entry.type==='collection') totalCollected[item]=(totalCollected[item]||0)+(entry.data[item]||0);
      else if (entry.type==='delivery') totalDelivered[item]=(totalDelivered[item]||0)+(entry.data[item]||0);
    });
  });

  // Currently with GL = ALL collections since last delivery combined
  const pendingCollections = glFlow.filter(g =>
    g.type==='collection' && (!lastDeliveryDate || g.date>=lastDeliveryDate)
  );
  const withGL = {};
  ITEMS.forEach(item => {
    withGL[item] = pendingCollections.reduce((sum,col) => sum+(col.data[item]||0), 0);
  });

  const hasWithGL   = Object.values(withGL).some(v => v > 0);
  const unresolvedWatch = watchList.filter(w => !w.resolved);

  return <>
    {/* Currently with GL */}
    <div className="card">
      <div className="card-title">Currently with GL</div>
      {lastCollection
        ? <div style={{fontSize:12,color:'var(--text3)',marginBottom:12,fontFamily:'DM Mono,monospace'}}>
            {pendingCollections.length} collection{pendingCollections.length!==1?'s':''} with GL
            {lastDelivery ? ' — last delivery ' + fmtDate(lastDelivery.date) : ' — awaiting delivery'}
          </div>
        : null}
      {!lastCollection
        ? <div className="empty" style={{padding:'20px 0'}}><div className="empty-icon">🔄</div>No GL collections recorded yet</div>
        : !hasWithGL
        ? <div style={{color:'var(--green)',fontWeight:600,fontSize:14}}>✓ All linen has been returned by GL</div>
        : <table className="tbl">
            <thead><tr>
              <th>Item</th>
              <th className="center">With GL</th>
            </tr></thead>
            <tbody>{ITEMS.filter(i => (withGL[i]||0) > 0).map(item => (
              <tr key={item}>
                <td className="item-name">{item}</td>
                <td className="center mono" style={{fontWeight:700,color:'var(--accent)'}}>{withGL[item]}</td>
              </tr>
            ))}</tbody>
          </table>}
    </div>

    {/* Last Collection */}
    {lastCollection && <div className="card">
      <div className="card-title">Last Collection — {fmtDate(lastCollection.date)}</div>
      <table className="tbl">
        <thead><tr><th>Item</th><th className="center">Qty</th></tr></thead>
        <tbody>{ITEMS.filter(i=>(lastCollection.data[i]||0)>0).map(item => (
          <tr key={item}>
            <td className="item-name">{item}</td>
            <td className="center mono">{lastCollection.data[item]}</td>
          </tr>
        ))}</tbody>
      </table>
      {lastCollection.notes && <div style={{marginTop:8,fontSize:12,color:'var(--text2)',fontStyle:'italic'}}>Note: {lastCollection.notes}</div>}
      {lastCollection.extras && Object.values(lastCollection.extras).some(v=>v>0) && <>
        <div style={{marginTop:12,fontWeight:600,fontSize:13,color:'var(--text2)'}}>Extras included:</div>
        {ITEMS.filter(i=>(lastCollection.extras[i]||0)>0).map(item => (
          <div key={item} style={{fontSize:12,color:'var(--text2)',padding:'2px 0'}}>
            {item}: <span style={{fontWeight:700}}>{lastCollection.extras[item]}</span>
          </div>
        ))}
      </>}
    </div>}

    {/* Last Delivery */}
    {lastDelivery && <div className="card">
      <div className="card-title">Last Delivery — {fmtDate(lastDelivery.date)}</div>
      <table className="tbl">
        <thead><tr><th>Item</th><th className="center">Received</th></tr></thead>
        <tbody>{ITEMS.filter(i=>(lastDelivery.data[i]||0)>0).map(item => (
          <tr key={item}>
            <td className="item-name">{item}</td>
            <td className="center mono">{lastDelivery.data[item]}</td>
          </tr>
        ))}</tbody>
      </table>
      {lastDelivery.missing?.length > 0 && <div style={{marginTop:8,background:'rgba(229,62,62,.08)',border:'1px solid rgba(229,62,62,.2)',borderRadius:'8px',padding:'10px 12px'}}>
        <div style={{fontWeight:700,color:'var(--red)',fontSize:13,marginBottom:6}}>⚠ Short on delivery:</div>
        {lastDelivery.missing.map(m => (
          <div key={m.item} style={{fontSize:12,color:'var(--text2)',padding:'2px 0'}}>
            {m.item}: sent {m.sent}, received {m.received} — <span style={{color:'var(--red)',fontWeight:700}}>{m.short} missing</span>
          </div>
        ))}
      </div>}
    </div>}

    {/* Watch List */}
    {unresolvedWatch.length > 0 && <div className="card" style={{background:'rgba(245,158,11,.06)',border:'1px solid rgba(245,158,11,.2)'}}>
      <div className="card-title" style={{color:'var(--amber)'}}>⚠ Outstanding — Items Still Owed by GL ({unresolvedWatch.length})</div>
      {unresolvedWatch.map(w => (
        <div key={w.id} style={{padding:'7px 0',borderBottom:'1px solid var(--border)',fontSize:13}}>
          <span style={{fontWeight:600}}>{w.item}</span> — 
          <span className="c-red mono"> {w.short} missing</span>
          <span style={{fontSize:11,color:'var(--text3)',marginLeft:8}}>from {fmtDate(w.fromDate)} · sent {w.sent}, received {w.received}</span>
        </div>
      ))}
    </div>}
  </>;
}


// ── DAILY REPORT TAB ──────────────────────────────────────────────────────────
function DailyReportTab({counts, todayCheckouts, deferred, saveDeferred, lodges}) {
  const [reportDate, setReportDate] = useState(todayStr());

  const dateCheckouts = todayCheckouts; // for today — could extend to other dates

  // Get all counts for report date
  const dateCounts = counts.filter(c => c.date === reportDate && c.type !== 'stockout');
  const dateStockOuts = counts.filter(c => c.date === reportDate && c.type === 'stockout');
  const countedLodges = new Set(dateCounts.map(c => c.lodge));
  const stockOutLodges = new Set(dateStockOuts.map(c => c.lodge));

  // For today use todayCheckouts, for other dates use all lodges that had counts
  const checkoutsForDate = reportDate === todayStr()
    ? todayCheckouts
    : [...new Set([...dateCounts.map(c=>c.lodge), ...dateStockOuts.map(c=>c.lodge)])];

  const uncounted = checkoutsForDate.filter(l => {
    if (deferred && deferred[l] === reportDate) return false;
    return !countedLodges.has(l);
  });
  const deferredLodges = checkoutsForDate.filter(l => deferred && deferred[l] === reportDate);

  const undefferLodge = (lodge) => {
    const updated = {...(deferred||{})};
    delete updated[lodge];
    saveDeferred(updated);
  };

  // Totals
  const ITEMS = ['Bath Sheet','Bath Mat','Hand Towel','S King D','S King S',
                 'King D','King S','Single D','Single S','Pillow C','Oxford','Tea Towel'];

  const actualTotals = {};
  const expectedTotals = {};
  ITEMS.forEach(item => { actualTotals[item] = 0; expectedTotals[item] = 0; });

  dateCounts.forEach(c => {
    ITEMS.forEach(item => {
      if (c.actual[item] != null) actualTotals[item] += c.actual[item];
      if (c.expected[item]) expectedTotals[item] += c.expected[item];
    });
  });

  const shortLodges = dateCounts.filter(c => c.hasShort);
  const overLodges  = dateCounts.filter(c => c.hasOver && !c.hasShort);

  return <>
    <div className="card">
      <div className="card-title">Report Date</div>
      <input type="date" value={reportDate} onChange={e=>setReportDate(e.target.value)}/>
    </div>

    {/* Summary stats */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:12}}>
      {[
        ['Checkouts', checkoutsForDate.length, 'var(--accent)'],
        ['Counted', countedLodges.size, 'var(--green)'],
        ['Not Counted', uncounted.length, uncounted.length>0?'var(--red)':'var(--green)'],
      ].map(([label,val,color]) => <div key={label} className="card" style={{textAlign:'center',marginBottom:0}}>
        <div className="card-title" style={{margin:0,marginBottom:4}}>{label}</div>
        <div style={{fontSize:36,fontWeight:700,color,fontFamily:'DM Mono,monospace'}}>{val}</div>
      </div>)}
    </div>

    {/* Uncounted lodges */}
    {uncounted.length > 0 && <div className="card" style={{background:'rgba(229,62,62,.05)',border:'1px solid rgba(229,62,62,.2)',marginBottom:12}}>
      <div className="card-title" style={{color:'var(--red)'}}>❌ Not Counted ({uncounted.length})</div>
      {uncounted.map(l => <div key={l} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
        <span style={{fontWeight:700,color:'var(--red)'}}>{l}</span>
        <button className="btn btn-ghost btn-sm" onClick={()=>saveDeferred({...(deferred||{}),[l]:reportDate})}
          style={{fontSize:11}}>→ Defer</button>
      </div>)}
    </div>}

    {/* Deferred lodges */}
    {deferredLodges.length > 0 && <div className="card" style={{background:'rgba(245,158,11,.05)',border:'1px solid rgba(245,158,11,.2)',marginBottom:12}}>
      <div className="card-title" style={{color:'var(--amber)'}}>→ Deferred to Tomorrow ({deferredLodges.length})</div>
      {deferredLodges.map(l => <div key={l} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
        <span style={{fontWeight:700,color:'var(--amber)'}}>{l}</span>
        <button className="btn btn-ghost btn-sm" onClick={()=>undefferLodge(l)} style={{fontSize:11}}>✕ Remove</button>
      </div>)}
    </div>}

    {/* Counted with issues */}
    {shortLodges.length > 0 && <div className="card" style={{background:'rgba(229,62,62,.05)',border:'1px solid rgba(229,62,62,.2)',marginBottom:12}}>
      <div className="card-title" style={{color:'var(--red)'}}>⚠ Counted — Items Missing ({shortLodges.length})</div>
      {shortLodges.map(c => <div key={c.id} style={{padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
        <div style={{fontWeight:700,fontSize:14}}>{c.lodge}</div>
        <div style={{fontSize:12,color:'var(--text2)'}}>Missing: {c.shorts.join(', ')}</div>
      </div>)}
    </div>}

    {/* Linen totals */}
    {dateCounts.length > 0 && <div className="card">
      <div className="card-title">Linen Counted In — Totals</div>
      <table className="tbl">
        <thead><tr><th>Item</th><th className="center">Expected</th><th className="center">Actual</th><th className="center">Diff</th></tr></thead>
        <tbody>
          {ITEMS.filter(i=>expectedTotals[i]>0||actualTotals[i]>0).map(item => {
            const exp=expectedTotals[item], act=actualTotals[item], diff=act-exp;
            const color=diff<0?'var(--red)':diff>0?'var(--amber)':'var(--green)';
            return <tr key={item}>
              <td className="item-name">{item}</td>
              <td className="center mono">{exp||'—'}</td>
              <td className="center mono">{act||'—'}</td>
              <td className="center mono" style={{color,fontWeight:700}}>
                {diff===0?'✓':diff>0?`+${diff}`:diff}
              </td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>}

    {dateCounts.length === 0 && uncounted.length === 0 &&
      <div className="empty"><div className="empty-icon">📋</div>No data for this date</div>}
  </>;
}

// ── SETTINGS TAB ──────────────────────────────────────────────────────────────
function SettingsTab({lodges, saveLodges}) {
  const [name, setName] = useState('');
  const [quantities, setQuantities] = useState({});
  const [saved, setSaved] = useState(false);
  const [deleting, setDeleting] = useState(null);

  const addLodge = () => {
    if (!name.trim()) return;
    saveLodges({...lodges,[name.trim().toUpperCase()]:{...quantities}});
    setName(''); setQuantities({}); setSaved(true);
    setTimeout(()=>setSaved(false),2000);
  };
  const deleteLodge = lodge => { const n={...lodges}; delete n[lodge]; saveLodges(n); setDeleting(null); };

  return <>
    {saved && <div className="card" style={{background:'rgba(34,197,94,.1)',border:'1px solid rgba(34,197,94,.3)',marginBottom:12}}>
      <div style={{color:'var(--green)',fontWeight:700}}>✓ Lodge added successfully</div>
    </div>}
    <div className="card">
      <div className="card-title">Add New Lodge</div>
      <div style={{marginBottom:12}}>
        <div className="field-label" style={{marginBottom:4}}>Lodge Code</div>
        <input type="text" placeholder="e.g. ML29" value={name} onChange={e=>setName(e.target.value.toUpperCase())}/>
      </div>
      <div className="section-hdr">Linen Quantities</div>
      <table className="tbl">
        <thead><tr><th>Item</th><th className="center">Qty</th></tr></thead>
        <tbody>{ITEMS.map(item => <tr key={item}>
          <td className="item-name">{item}</td>
          <td><div className="stepper">
            <button className="step-btn" onClick={()=>setQuantities(p=>({...p,[item]:Math.max(0,(p[item]||0)-1)}))}>−</button>
            <input className="step-inp" type="number" min="0" value={quantities[item]??0} onChange={e=>setQuantities(p=>({...p,[item]:Math.max(0,parseInt(e.target.value)||0)}))}/>
            <button className="step-btn" onClick={()=>setQuantities(p=>({...p,[item]:(p[item]||0)+1}))}>+</button>
          </div></td>
        </tr>)}</tbody>
      </table>
      <button className="btn btn-primary btn-full" style={{marginTop:12}} onClick={addLodge}>+ Add Lodge</button>
    </div>
    <div className="card">
      <div className="card-title">Manage Lodges ({Object.keys(lodges).length})</div>
      {Object.keys(lodges).sort().map(lodge => <div key={lodge} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
        <div style={{fontWeight:600}}>{lodge}</div>
        {deleting===lodge ? <div style={{display:'flex',gap:6}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setDeleting(null)}>Cancel</button>
          <button className="btn btn-danger btn-sm" onClick={()=>deleteLodge(lodge)}>Delete</button>
        </div> : <button className="btn btn-ghost btn-sm" onClick={()=>setDeleting(lodge)}>Remove</button>}
      </div>)}
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
