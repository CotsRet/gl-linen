    const lastCol = glFlow.find(g=>g.type==='collection');
    const cutoff = lastCol ? lastCol.date : null;
    const relevant = cutoff
      ? counts.filter(c=>c.date>cutoff && c.date<=todayStr() && c.type!=='stockout')
      : counts.filter(c=>c.date<=todayStr() && c.type!=='stockout');

    // Transparency — show what will be included before filling
    const dates = [...new Set(relevant.map(c=>c.date))].sort();
    const lodges = [...new Set(relevant.map(c=>c.lodge))].sort();
    const msg = `Auto-fill will include counts from:\n\nDates: ${dates.join(', ')||'none'}\nLodges (${lodges.length}): ${lodges.join(', ')||'none'}\n\nCutoff: ${cutoff ? 'after '+cutoff : 'all dates'}\n\nProceed?`;
    if (!window.confirm(msg)) return;
    const totals={};
    // Only count each lodge once per date (most recent entry wins)
    const seen = new Set();
    relevant.forEach(entry => {
      const key = entry.lodge + '_' + entry.date;
      if (!seen.has(key)) {
        seen.add(key);
        ITEMS.forEach(item => {
          const v=entry.actual[item];
          if(v!=null) totals[item]=(totals[item]||0)+v;
        });
      }
    });
    setFormData(totals);
  };

  const saveEntry = () => {
    if (!staffName.trim()) {
      alert('Please enter your name before saving.');
      return;
    }
    // A GL collection must ALWAYS include the lodge counts (pulled in via the
    // "Auto-fill from lodge counts" button). Guard the common staff error of
    // adding only extras and saving, which leaves the actual bag-ins out of the
    // collection. Fires whenever the count cells total zero (auto-fill not done,
    // or genuinely nothing to fill).
    if (formType==='collection') {
      const filledTotal = ITEMS.reduce((s,item)=>s+(parseInt(formData[item])||0),0);
      if (filledTotal===0) {
        alert('\u26A0\uFE0F No lodge counts on this collection.\n\nPress "\u27F3 Auto-fill from lodge counts" first so the linen counted at the lodges is included.\n\nA GL collection should always have the lodge counts filled in \u2014 saving with only extras (or empty) would under-record what was sent to GL. Nothing has been saved.');
        return;
      }
    }
    let missing=[];
    if (formType==='delivery') {
      const lastCol=[...glFlow].find(g=>g.type==='collection');
      if (lastCol) ITEMS.forEach(item => {
        const sent=lastCol.data[item]||0, recv=formData[item]||0;
        if (recv<sent) missing.push({item,sent,received:recv,short:sent-recv});
      });
    }
    // Merge extras into collection data
    const finalData = {...formData};
    if (formType==='collection') {
      Object.keys(extras).forEach(item => {
        if ((extras[item]||0) > 0) finalData[item] = (finalData[item]||0) + extras[item];
      });
    }
    const entry={
      id:Date.now(),
      type:formType,
      date:formDate,
      data:finalData,
      extras:formType==='collection'?{...extras}:{},
      notes:formNotes,
      staffName:staffName.trim(),
      missing,
      ts:new Date().toISOString()
    };
    saveGlFlow([entry,...glFlow]);
    if (missing.length>0) {
      const watches=missing.map(m=>({...m,fromDate:formDate,id:Date.now()+Math.random(),resolved:false}));
      saveWatch([...watchList,...watches]);
    }
    // If delivery — automatically add quantities to warehouse shelf stock
    if (formType==='delivery') {
      const newShelf = {...shelf};
      const added = {};
      ITEMS.forEach(item => {
        if ((finalData[item]||0) > 0) {
          newShelf[item] = (newShelf[item]||0) + (finalData[item]||0);
          added[item] = finalData[item];
        }
      });
      newShelf._date = formDate;
      newShelf._updated = new Date().toISOString();
      saveShelf(newShelf, 'glflow_delivery', {date: formDate, staffName: staffName.trim(), added, notes: formNotes});
    } else {
      // Collection — doesn't change shelf, so write an audit entry directly
      supaAudit('glflow_collection', {date: formDate, staffName: staffName.trim(), data: finalData, extras: {...extras}, notes: formNotes});
    }
    setView('log'); setFormData({}); setFormNotes(''); setExtras({}); setStaffName('');
  };

  const unresolved = watchList.filter(w=>!w.resolved);

  const adj = (item,d) => setFormData(p=>({...p,[item]:Math.max(0,(p[item]||0)+d)}));

  if (view==='form') return <>
    <div className="card">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setView('log')}>← Back</button>
        <div style={{fontSize:16,fontWeight:700}}>{formType==='collection'?'📤 GL Collection':'📥 GL Delivery'}</div>
      </div>
      <div style={{marginBottom:12}}>
        <div className="field-label" style={{marginBottom:4}}>Date</div>
        <input type="date" value={formDate} onChange={e=>setFormDate(e.target.value)}/>
      </div>
      <div style={{marginBottom:12}}>
        <div className="field-label" style={{marginBottom:4}}>Your name (required)</div>
        <input type="text" placeholder="Your name" value={staffName} onChange={e=>setStaffName(e.target.value)}/>
      </div>
      {formType==='collection' && <button className="btn btn-ghost btn-full" style={{marginBottom:12}} onClick={autoFill}>⟳ Auto-fill from lodge counts</button>}
      <table className="tbl">
        <thead><tr><th>Item</th><th className="center">{formType==='collection'?'Sent to GL':'Received from GL'}</th></tr></thead>
        <tbody>{ITEMS.map(item => <tr key={item}>
          <td className="item-name">{item}</td>
          <td><div className="stepper">
            <button className="step-btn" onClick={()=>adj(item,-1)}>−</button>
            <input className="step-inp" type="number" min="0" value={formData[item]??0} onChange={e=>setFormData(p=>({...p,[item]:Math.max(0,parseInt(e.target.value)||0)}))}/>
            <button className="step-btn" onClick={()=>adj(item,1)}>+</button>
          </div></td>
        </tr>)}</tbody>
      </table>
      {formType==='collection' && <>
        <div style={{marginTop:12,borderTop:'1px solid var(--border)',paddingTop:12}}>
          <div className="card-title">Extras — Additional items being sent to GL</div>
          <div style={{fontSize:12,color:'var(--text2)',marginBottom:8}}>Items found after last clean, rejects or any additional linen not in the standard lodge count</div>
          <table className="tbl">
            <thead><tr><th>Item</th><th className="center">Extra Qty</th></tr></thead>
            <tbody>
              {ITEMS.map(item => (
                <tr key={item}>
                  <td className="item-name">{item}</td>
                  <td><div className="stepper">
                    <button className="step-btn" onClick={()=>setExtras(p=>({...p,[item]:Math.max(0,(p[item]||0)-1)}))}>−</button>
                    <input className="step-inp" type="number" min="0" value={extras[item]||0}
                      onChange={e=>setExtras(p=>({...p,[item]:Math.max(0,parseInt(e.target.value)||0)}))}/>
                    <button className="step-btn" onClick={()=>setExtras(p=>({...p,[item]:(p[item]||0)+1}))}>+</button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </>}
      <div style={{marginTop:12}}>
        <div className="field-label" style={{marginBottom:4}}>Notes</div>
        <input type="text" placeholder="Any notes..." value={formNotes} onChange={e=>setFormNotes(e.target.value)}/>
      </div>
      <div className="btn-row">
        <button className="btn btn-ghost" onClick={()=>{setView('log');setStaffName('');}}>Cancel</button>
        <button className="btn btn-primary" onClick={saveEntry}>✓ Save Record</button>
      </div>
    </div>
  </>;

  return <>
    <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
      <button className="btn btn-ghost" style={{flex:1}} onClick={()=>{setFormType('collection');setView('form');}}>📤 New Collection</button>
      <button className="btn btn-primary" style={{flex:1}} onClick={()=>{setFormType('delivery');setView('form');}}>📥 New Delivery</button>
      <button className="btn btn-sm" style={{background:'rgba(229,62,62,.1)',color:'var(--red)',border:'1px solid rgba(229,62,62,.3)'}}
        onClick={()=>{ if(window.confirm('Clear all GL Flow records?')) { saveGlFlow([]); saveWatch([]); } }}>🗑 Clear</button>
    </div>
    {unresolved.length>0 && <div className="watch-box">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:8}}>
        <div style={{fontWeight:700,color:'var(--amber)'}}>⚠ Watch List — Items Still Owed by GL</div>
        <button className="btn btn-ghost btn-sm" style={{color:'var(--amber)',borderColor:'var(--amber)',whiteSpace:'nowrap'}}
          onClick={()=>{ if(window.confirm('Clear the watch list?\n\nThis marks all '+unresolved.length+' owed item(s) as resolved. The records are kept — they\'re just removed from this list.')) { saveWatch(watchList.map(x=>x.resolved?x:{...x,resolved:true})); if(typeof supaAudit==='function') supaAudit('watchlist_cleared',{count:unresolved.length}); } }}>Clear list</button>
      </div>
      {unresolved.map(w => <div key={w.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderBottom:'1px solid rgba(217,119,6,.2)'}}>
        <div>
          <div style={{fontWeight:600,fontSize:13}}>{w.item} <span className="c-red mono">−{w.short}</span></div>
          <div style={{fontSize:11,color:'var(--text3)'}}>From delivery {fmtDate(w.fromDate)} · sent {w.sent}, received {w.received}</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={()=>saveWatch(watchList.map(x=>x.id===w.id?{...x,resolved:true}:x))}>✓ Received</button>
      </div>)}
    </div>}
    {!glFlow.length ? <div className="empty"><div className="empty-icon">🔄</div>No GL records yet</div>
    : glFlow.slice(0,20).map(entry => {
      const lastCol = entry.type==='delivery' ? glFlow.find(g=>g.type==='collection'&&g.date<entry.date) : null;
      return <div key={entry.id} className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div>
            <div style={{fontWeight:700,fontSize:15}}>{entry.type==='collection'?'📤 GL Collection':'📥 GL Delivery'}</div>
            <div style={{fontSize:12,color:'var(--text3)',fontFamily:'DM Mono,monospace'}}>{fmtDate(entry.date)}{entry.staffName && <span style={{marginLeft:8,color:'var(--text3)',fontSize:11}}>by {entry.staffName}</span>}</div>
          </div>
          {entry.missing?.length>0 && <span className="chip chip-short">⚠ Short</span>}
        </div>
        <table className="tbl">
          <thead><tr>
            <th>Item</th>
            <th className="center">{entry.type==='collection'?'Sent':'Received'}</th>
            {lastCol && <th className="center">Was Sent</th>}
            {lastCol && <th className="center">Diff</th>}
          </tr></thead>
          <tbody>{ITEMS.filter(i=>(entry.data[i]||0)>0||(lastCol&&(lastCol.data[i]||0)>0)).map(item => {
            const val=entry.data[item]||0, sent=lastCol?lastCol.data[item]||0:null;
            const diff=sent!==null?val-sent:null;
            return <tr key={item}>
              <td className="item-name">{item}</td>
              <td className="center mono">{val||'—'}</td>
              {lastCol && <td className="center mono c-muted">{sent||'—'}</td>}
              {lastCol && <td className="center mono">
                {diff===null?'—':diff<0?<span className="c-red">▼{Math.abs(diff)}</span>
                  :diff>0?<span className="c-amber">▲{diff}</span>:diff===0?<span className="c-green">✓</span>:'—'}
              </td>}
            </tr>;
          })}</tbody>
        </table>
        {entry.notes && <div style={{marginTop:8,fontSize:12,color:'var(--text2)',fontStyle:'italic'}}>Note: {entry.notes}</div>}
      </div>;
    })}
  </>;
}

// ── FORECAST TAB ──────────────────────────────────────────────────────────────
function ForecastTab({shelf, lodges, season, saveSeason, glFlow, counts}) {
  const [fcData, setFcData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const GL_DAYS = {high:[1,3,5], low:[1,4]};
  const isGlDay = d => GL_DAYS[season].includes(new Date(d+'T12:00:00').getDay());

  const buildForecast = (checkouts) => {
    // "Expected delivery" = most recent collection ONLY if no delivery has been
    // logged since that collection. Once GL delivers it back, the collection is
    // "matched" — we don't expect another delivery until a new collection happens.
    // Uses ts (insert timestamp) for comparison so a same-day collection+delivery
    // pair compares correctly by insertion order.
    let glExpected = null;        // null = TBD (no outstanding collection)
    let glExpectedFrom = null;     // date of the collection driving the estimate
    if (Array.isArray(glFlow) && glFlow.length) {
      const lastCollection = glFlow.find(g => g.type === 'collection');
      const lastDelivery   = glFlow.find(g => g.type === 'delivery');
      if (lastCollection) {
        const collKey = lastCollection.ts || lastCollection.date || '';
        const delvKey = lastDelivery ? (lastDelivery.ts || lastDelivery.date || '') : '';
        // Collection is "outstanding" only if logged AFTER the most recent delivery
        if (!lastDelivery || collKey > delvKey) {
          glExpected = lastCollection.data || {};
          glExpectedFrom = lastCollection.date;
        }
      }
    }

    // Build a set of "lodge|date" pairs for which a bag has been prepared, plus
    // a per-lodge set of recently-bagged stockouts as a fallback for legacy
    // entries that don't carry forCheckoutDate.
    // Returned-unused stockouts are excluded — they're back on the shelf.
    const bagged = new Set();              // exact match: "<lodge>|<forCheckoutDate>"
    const recentlyBagged = new Set();      // legacy fallback: lodges with a stockout in last 3 days
    const today = todayStr();
    const threeDaysAgo = new Date(); threeDaysAgo.setDate(threeDaysAgo.getDate()-3);
    const threeDaysAgoStr = threeDaysAgo.toISOString().split('T')[0];
    (counts || []).forEach(c => {
      if (!c || c.type !== 'stockout' || c.returnedUnused) return;
      if (c.forCheckoutDate) {
        bagged.add(`${c.lodge}|${c.forCheckoutDate}`);
      } else if ((c.date || '') >= threeDaysAgoStr) {
        // Legacy entry without forCheckoutDate — fall back to "any recent bag for this lodge"
        recentlyBagged.add(c.lodge);
      }
    });

    const days=[];
    let runningShelf = {...shelf};

    for (let i=0;i<8;i++) {  // Start from today (i=0) through +7 days
      const d=new Date(); d.setDate(d.getDate()+i);
      const dateStr=d.toISOString().split('T')[0];
      const allCheckoutLodges = (checkouts[dateStr]||[]).filter(l=>!EXCLUDED.has(l)&&lodges[l]);
      // Lodges whose bag has been prepared for this exact date — skip from need
      const preparedLodges = allCheckoutLodges.filter(l => bagged.has(`${l}|${dateStr}`));
      // Lodges whose bag is NOT prepared yet (need linen for them)
      // Fall back to recentlyBagged for legacy entries.
      const lodgeList = allCheckoutLodges.filter(l =>
        !bagged.has(`${l}|${dateStr}`) && !recentlyBagged.has(l)
      );
      const totals={};
      lodgeList.forEach(l => ITEMS.forEach(item => { totals[item]=(totals[item]||0)+(lodges[l][item]||0); }));
      const glDay = isGlDay(dateStr);

      // Capture shelf before any changes this day
      const shelfBefore = {...runningShelf};

      // GL delivery arrives late afternoon — available for cleans from NEXT day
      // So add GL delivery AFTER deducting today's cleans
      const shelfWithGL = {...shelfBefore}; // for display purposes only

      // Deduct linen going out to get shelf after
      const shelfAfter = {};
      ITEMS.forEach(item => {
        shelfAfter[item] = (shelfBefore[item]||0) - (totals[item]||0);
      });

      // Add GL delivery to carry forward (available from tomorrow) — but ONLY if we
      // have an outstanding collection. If glExpected is null, it's TBD.
      // Only the FIRST GL day in the window gets the expected delivery applied —
      // subsequent GL days are TBD because we won't know what's coming until a
      // new collection happens.
      const applyHere = glDay && glExpected && !days.some(p => p.isGl && p.glDelivery);
      if (applyHere) {
        ITEMS.forEach(item => {
          shelfAfter[item] = (shelfAfter[item]||0) + (glExpected[item]||0);
          shelfWithGL[item] = (shelfBefore[item]||0) + (glExpected[item]||0); // display only
        });
      }

      // Carry forward for next day
      runningShelf = {...shelfAfter};

      days.push({date:dateStr, lodges:lodgeList, totals, isGl:glDay,
                 preparedLodges, allCheckoutLodges,
                 glDelivery: applyHere ? glExpected : null,
                 glExpectedFrom: applyHere ? glExpectedFrom : null,
                 glTbd: glDay && !applyHere,
                 shelfBefore, shelfWithGL, shelfAfter});
    }
    setFcData(days);
  };

  const GITHUB_JSON_URL = 'https://raw.githubusercontent.com/CotsRet/gl-linen/main/checkouts.json';

  const fetchForecast = async () => {
    setLoading(true); setError('');
    try {
      const resp = await fetch(GITHUB_JSON_URL + '?t=' + Date.now());
      if (!resp.ok) throw new Error('File not found');
      const data = await resp.json();
      const generated = data._generated ? new Date(data._generated).toLocaleString('en-GB') : 'unknown';
      console.log('checkouts.json loaded, generated:', generated);
      buildForecast(data);
    } catch(e) {
      setError('Could not load forecast data. Make sure beds24_report.py has run recently and checkouts.json is on GitHub.');
      console.error(e);
    }
    setLoading(false);
  };

  return <>
    <div className="card">
      <div className="card-title">GL Schedule</div>
      <div className="season-row">
        <div className={`season-btn${season==='high'?' on':''}`} onClick={()=>saveSeason('high')}>
          High Season<br/><span style={{fontSize:11,opacity:.7}}>Mon · Wed · Fri</span>
        </div>
        <div className={`season-btn${season==='low'?' on':''}`} onClick={()=>saveSeason('low')}>
          Low Season<br/><span style={{fontSize:11,opacity:.7}}>Mon · Thu</span>
        </div>
      </div>
      <button className="btn btn-primary btn-full" onClick={fetchForecast} disabled={loading}>
        {loading?'⟳ Loading forecast...':'⟳ Load 7-Day Forecast'}
      </button>
      {error && <div style={{color:'var(--red)',fontSize:13,marginTop:8}}>{error}</div>}
    </div>
    {!fcData && !loading && <div className="empty"><div className="empty-icon">📅</div>Press Load to fetch live checkout data</div>}
    {fcData && fcData.map(day => {
      const items=ITEMS.filter(i=>(day.totals[i]||0)>0);
      return <div key={day.date} className="fc-day" style={day.isGl?{border:'1px solid rgba(45,158,95,.4)'}:{}}>
        <div className="fc-day-header">
          <div>
            <div className="fc-day-name">{getDayName(day.date)}</div>
            <div className="fc-day-date">
              {fmtDate(day.date)} · {day.allCheckoutLodges ? day.allCheckoutLodges.length : day.lodges.length} GL lodges
              {day.preparedLodges && day.preparedLodges.length > 0 &&
                <span style={{color:'var(--accent)',marginLeft:6}}>· {day.preparedLodges.length} already bagged</span>}
            </div>
          </div>
          {day.isGl && <div className="fc-gl-badge">GL Day</div>}
        </div>
        {day.isGl && day.glDelivery && Object.values(day.glDelivery).some(v=>v>0) && (
        <div style={{background:'rgba(45,158,95,.08)',border:'1px solid rgba(45,158,95,.2)',borderRadius:'8px',padding:'8px 10px',marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--accent)',marginBottom:4,textTransform:'uppercase',letterSpacing:'.5px'}}>
            Expected GL Delivery
            {day.glExpectedFrom && <span style={{fontWeight:500,opacity:.75,marginLeft:6,textTransform:'none',letterSpacing:0}}>
              · based on collection {fmtDate(day.glExpectedFrom)}
            </span>}
          </div>
          <div style={{fontSize:12,color:'var(--text2)',display:'flex',flexWrap:'wrap',gap:'4px 16px'}}>
            {ITEMS.filter(i=>(day.glDelivery[i]||0)>0).map(i=>(
              <span key={i}>{i}: <span style={{fontWeight:700,color:'var(--accent)'}}>{day.glDelivery[i]}</span></span>
            ))}
          </div>
        </div>
      )}
      {day.glTbd && (
        <div style={{background:'rgba(127,127,127,.06)',border:'1px solid rgba(127,127,127,.2)',borderRadius:'8px',padding:'8px 10px',marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',marginBottom:4,textTransform:'uppercase',letterSpacing:'.5px'}}>
            GL Delivery — TBD
          </div>
          <div style={{fontSize:12,color:'var(--text3)'}}>
            No outstanding collection — quantities unknown until the next dirty bag goes to GL.
          </div>
        </div>
      )}
      {!items.length ? (
          day.preparedLodges && day.preparedLodges.length > 0 && day.preparedLodges.length === (day.allCheckoutLodges||[]).length ?
            <div style={{color:'var(--accent)',fontSize:13,fontStyle:'italic'}}>✓ All bags already prepared for this day</div>
            : <div style={{color:'var(--text3)',fontSize:13}}>No GL cleans</div>
        )
        : items.map(item => {
          const need=day.totals[item]||0;
          const have = day.shelfBefore[item]||0; // GL delivery not available until next day
          const after=day.shelfAfter[item]||0;
          const ok=have>=need;
          return <div key={item} className="fc-item-row">
            <div className="fc-item-name">{item}</div>
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
              <div className="fc-item-shelf c-muted">available: {have}</div>
              <div className={`fc-item-need ${ok?'c-green':'c-red'}`}>need: {need}</div>
              <div style={{fontSize:11,color:'var(--text3)'}}>after: {after}</div>
              {!ok && <span className="chip chip-short">▼{need-have}</span>}
            </div>
          </div>;
        })}
      </div>;
    })}
  </>;
}


// ── WEEKLY SUMMARY TAB ───────────────────────────────────────────────────────
function WeeklySummaryTab({counts, lodges, glFlow}) {
  const [expanded, setExpanded] = useState(null);

  const ITEMS = ['Bath Sheet','Bath Mat','Hand Towel','S King D','S King S',
                 'King D','King S','Single D','Single S','Pillow C','Oxford','Tea Towel'];

  // Build last 7 days
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().split('T')[0]);
  }

  // Build summary for each day — simple view, just what came in
  const summaries = days.map(date => {
    const dayCounts     = counts.filter(c => c.date === date && c.type !== 'stockout');
    const dayOuts       = counts.filter(c => c.date === date && c.type === 'stockout');
    const countedLodges = dayCounts.map(c => c.lodge);

    // Tally actual pieces counted in
    const actual = {};
    ITEMS.forEach(i => { actual[i] = 0; });
    dayCounts.forEach(c => {
      ITEMS.forEach(item => {
        if (c.actual && c.actual[item]) actual[item] += c.actual[item];
      });
    });

    const totalActual = Object.values(actual).reduce((s,v)=>s+v,0);
    const bsActual    = actual['Bath Sheet'] || 0;

    return {date, dayCounts, dayOuts, countedLodges,
            actual, totalActual, bsActual};
  });

  const fmtDay = date => {
    const d = new Date(date + 'T12:00:00');
    return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  };

  return <>
    <div className="card" style={{marginBottom:8}}>
      <div className="card-title">7 Day Summary</div>
      <div style={{fontSize:12,color:'var(--text2)'}}>Tap a day to expand details</div>
    </div>

    {summaries.map(s => {
      const isExpanded = expanded === s.date;
      const isToday = s.date === todayStr();
      const bsColor = s.bsDiff < 0 ? 'var(--red)' : s.bsDiff > 0 ? 'var(--amber)' : 'var(--green)';

      return <div key={s.date} className="card" style={{
        marginBottom:8,
        borderLeft: `4px solid ${s.totalActual===0 ? 'var(--border)' : 'var(--green)'}`,
        background: isToday ? 'rgba(72,199,142,.04)' : 'var(--surf)'
      }}>
        {/* Header row */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}
          onClick={()=>setExpanded(isExpanded ? null : s.date)}>
          <div>
            <div style={{fontWeight:700,fontSize:15}}>{fmtDay(s.date)}{isToday?' (Today)':''}</div>
            <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>
              {s.dayOuts.length} deliveries out · {s.countedLodges.length} bags counted in
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:22,fontWeight:900,fontFamily:'DM Mono,monospace',color:'var(--accent)'}}>
              {s.bsActual}<span style={{fontSize:12,color:'var(--text3)'}}> BS in</span>
            </div>
            <div style={{fontSize:11,color:'var(--text3)'}}>{isExpanded?'▲ collapse':'▼ expand'}</div>
          </div>
        </div>

        {/* Expanded detail */}
        {isExpanded && <>
          {/* Linen counted in table */}
          {s.totalActual > 0 && <table className="tbl" style={{marginTop:10}}>
            <thead>
              <tr>
                <th>Item</th>
                <th className="center">Counted In</th>
              </tr>
            </thead>
            <tbody>
              {ITEMS.filter(item => s.actual[item]>0).map(item => {
                const isBs = item === 'Bath Sheet';
                return <tr key={item} style={{background: isBs ? 'rgba(72,199,142,.04)' : ''}}>
                  <td className="item-name" style={{fontWeight: isBs ? 700 : 400}}>{item}</td>
                  <td className="center mono" style={{fontWeight: isBs ? 700 : 400}}>{s.actual[item]}</td>
                </tr>;
              })}
              <tr style={{borderTop:'2px solid var(--border)'}}>
                <td className="item-name" style={{fontWeight:700}}>Total</td>
                <td className="center mono" style={{fontWeight:700}}>{s.totalActual}</td>
              </tr>
            </tbody>
          </table>}

          {/* Counted lodges */}
          {s.countedLodges.length > 0 && <div style={{marginTop:10,fontSize:12,color:'var(--text2)'}}>
            <span style={{fontWeight:700,color:'var(--green)'}}>✓ Lodges: </span>
            {s.countedLodges.join(', ')}
          </div>}

          {s.totalActual === 0 &&
            <div style={{textAlign:'center',padding:'16px',fontSize:12,color:'var(--text3)'}}>No bags counted in this day</div>}
        </>}
      </div>;
    })}
  </>;
}

// ── HISTORY TAB ───────────────────────────────────────────────────────────────
function HistoryTab({counts, saveCounts, shelf, saveShelf, lodges, dismissedCheckouts, saveDismissedCheckouts}) {
  const [filter, setFilter] = useState('all');
  const [dateFilter, setDateFilter] = useState('');
  const [editEntry, setEditEntry] = useState(null);
  const [editData, setEditData] = useState({});

  const filtered = counts.filter(c => {
    if (c.type === 'stockout') {
      if (dateFilter && c.date !== dateFilter) return false;
      return filter === 'all' || filter === 'out';
    }
    if (dateFilter && c.date !== dateFilter) return false;
    if (filter==='out') return false;
    if (filter==='short') return c.hasShort;
    if (filter==='over') return c.hasOver&&!c.hasShort;
    if (filter==='ok') return !c.hasShort&&!c.hasOver;
    return true;
  }).sort((a,b)=>String(b.ts||b.date||'').localeCompare(String(a.ts||a.date||'')));

  const saveEdit = () => {
    const expected=editEntry.expected, shorts=[], overs=[];
    ITEMS.forEach(item => {
      const exp=expected[item]||0, act=editData[item];
      if (act!=null&&exp>0) { if(act<exp) shorts.push(item); if(act>exp) overs.push(item); }
    });
    saveCounts(counts.map(c=>c.id===editEntry.id?{...c,actual:{...editData},shorts,overs,hasShort:shorts.length>0,hasOver:overs.length>0}:c));
    setEditEntry(null);
  };

  return <>
    {editEntry && <div className="modal-bg" onClick={()=>setEditEntry(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Edit: {editEntry.lodge} — {fmtDate(editEntry.date)}</div>
        <table className="tbl">
          <thead><tr><th>Item</th>{editEntry.expected ? <th className="center">Expected</th> : null}<th className="center">Actual</th></tr></thead>
          <tbody>{ITEMS.filter(i=>((editEntry.expected||{})[i]||0)>0||(editEntry.actual||{})[i]>0).map(item => <tr key={item}>
            <td className="item-name">{item}</td>
            {editEntry.expected ? <td className="center exp-val">{(editEntry.expected||{})[item]||0}</td> : null}
            <td><div className="stepper">
              <button className="step-btn" onClick={()=>setEditData(p=>({...p,[item]:Math.max(0,(p[item]||0)-1)}))}>−</button>
              <input className="step-inp" type="number" min="0" value={editData[item]??0} onChange={e=>setEditData(p=>({...p,[item]:Math.max(0,parseInt(e.target.value)||0)}))}/>
              <button className="step-btn" onClick={()=>setEditData(p=>({...p,[item]:(p[item]||0)+1}))}>+</button>
            </div></td>
          </tr>)}</tbody>
        </table>
        <div className="btn-row" style={{marginTop:16}}>
          <button className="btn btn-ghost" onClick={()=>setEditEntry(null)}>Cancel</button>
          <button className="btn btn-primary" onClick={saveEdit}>Save Changes</button>
        </div>
      </div>
    </div>}
    <div style={{display:'flex',gap:6,marginBottom:8,flexWrap:'wrap',justifyContent:'space-between',alignItems:'center'}}>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {[['all','All'],['out','📤 Out'],['short','⚠ Short'],['over','↑ Over'],['ok','✓ OK']].map(([v,l]) =>
          <button key={v} className={`btn btn-sm ${filter===v?'btn-primary':'btn-ghost'}`} onClick={()=>setFilter(v)}>{l}</button>
        )}
      </div>
      <button className="btn btn-sm" style={{background:'rgba(229,62,62,.1)',color:'var(--red)',border:'1px solid rgba(229,62,62,.3)'}}
        onClick={()=>{ if(window.confirm('Clear all count history? This cannot be undone.')) saveCounts([]); }}>🗑 Clear All</button>
    </div>
    <div style={{display:'flex',gap:8,marginBottom:12,alignItems:'center'}}>
      <div className="field-label" style={{whiteSpace:'nowrap'}}>Date</div>
      <input type="date" value={dateFilter} onChange={e=>setDateFilter(e.target.value)}
        style={{flex:1,padding:'6px 10px',fontSize:13}}/>
      {dateFilter && <button className="btn btn-ghost btn-sm" onClick={()=>setDateFilter('')}>✕ Clear</button>}
    </div>

    {dismissedCheckouts && Object.keys(dismissedCheckouts).length > 0 && (
      <div className="card" style={{background:'rgba(127,127,127,.04)',border:'1px dashed rgba(127,127,127,.35)'}}>
        <div className="card-title" style={{color:'var(--text2)'}}>✕ Dismissed Checkouts</div>
        <div style={{fontSize:11,color:'var(--text3)',marginBottom:10}}>
          Checkouts marked as not real. Tap Undismiss to restore the alert.
        </div>
        {Object.entries(dismissedCheckouts)
          .sort((a,b) => (b[1]?.ts || '').localeCompare(a[1]?.ts || ''))
          .map(([key, info]) => {
            const [lodge, dt] = key.split('|');
            return <div key={key} style={{
              display:'flex',justifyContent:'space-between',alignItems:'center',
              padding:'8px 10px',borderRadius:6,background:'var(--surf2)',marginBottom:6
            }}>
              <div>
                <div style={{fontWeight:600,fontSize:13}}>{lodge} — {fmtDate(dt)}</div>
                <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>
                  {info?.reason || '(no reason given)'}{info?.staffName ? ` · ${info.staffName}` : ''}
                </div>
              </div>
              <button className="btn btn-ghost btn-sm"
                onClick={()=>{
                  if (!window.confirm(`Undismiss the checkout for ${lodge} on ${dt}?\n\nIt will be treated as a real checkout again and alerts may reappear.`)) return;
                  const updated = {...dismissedCheckouts};
                  delete updated[key];
                  saveDismissedCheckouts(updated);
                }}>↩ Undismiss</button>
            </div>;
          })}
      </div>
    )}
    {!filtered.length ? <div className="empty"><div className="empty-icon">📋</div>No counts recorded yet</div>
    : filtered.map(entry => {
      const isStockOut = entry.type === 'stockout';
      const color = isStockOut ? 'var(--accent)' : entry.hasShort?'var(--red)':entry.hasOver?'var(--amber)':'var(--green)';
      const icon  = isStockOut ? '📤' : entry.hasShort?'⚠':entry.hasOver?'↑':'✓';
      return <div key={entry.id} className="hist-item" style={entry.returnedUnused ? {opacity:.6} : {}}>
        <div className="hist-header">
          <div>
            <div className="hist-lodge" style={{color}}>{icon} {entry.lodge}
              {entry.assumed && <span style={{marginLeft:8,padding:'2px 8px',fontSize:10,fontWeight:700,letterSpacing:'.5px',background:'rgba(217,119,6,.12)',color:'var(--amber)',border:'1px solid rgba(217,119,6,.35)',borderRadius:10}}>≈ ASSUMED</span>}
              {entry.returnedUnused && <span style={{marginLeft:8,padding:'2px 8px',fontSize:10,fontWeight:700,letterSpacing:'.5px',background:'rgba(127,127,127,.15)',color:'var(--text2)',border:'1px solid rgba(127,127,127,.3)',borderRadius:10}}>↩ RETURNED</span>}
            </div>
            <div className="hist-date">{fmtDate(entry.date)}</div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            {isStockOut && !entry.returnedUnused && (
              <span className="edit-link" style={{color:'var(--text2)'}}
                onClick={()=>{
                  if (!window.confirm(`Mark ${entry.lodge} delivery as returned unused?\n\nThe linen will be added back to the warehouse shelf and no bag-in will be expected for this lodge today.\n\nThis cannot be undone from the app.`)) return;
                  // Reverse the shelf delta: add items back
                  const newShelf = {...shelf};
                  ITEMS.forEach(item => {
                    const qty = (entry.actual || entry.qty || {})[item] || 0;
                    if (qty > 0) newShelf[item] = (newShelf[item] || 0) + qty;
                  });
                  saveShelf(newShelf, 'delivery_returned_unused', {
                    lodge: entry.lodge, date: entry.date,
                    qtyReturned: {...(entry.actual || entry.qty || {})},
                    originalStockoutId: entry.id, staffName: ''
                  });
                  // Mark the entry as returned
                  saveCounts(counts.map(c => c.id === entry.id ? {...c, returnedUnused: true, returnedAt: new Date().toISOString()} : c));
                }}>↩ Return Unused</span>
            )}
            {!entry.returnedUnused && <span className="edit-link" onClick={()=>{setEditEntry(entry);setEditData({...entry.actual});}}>Edit</span>}
          </div>
        </div>
        <div className="hist-items">
          {entry.type==='stockout'
            ? ITEMS.filter(i=>(entry.actual[i]||0)>0).map(item => (
                <span key={item} style={{marginRight:12}}>
                  {item}: <span className="mono c-blue">{entry.actual[item]}</span>
                </span>
              ))
            : ITEMS.filter(i=>(entry.expected[i]||0)>0).map(item => {
                const exp=entry.expected[item],act=entry.actual[item],diff=act!=null?act-exp:null;
                const isShort=diff!==null&&diff<0;
                const missing=isShort?Math.abs(diff):0;
                return <span key={item} style={{marginRight:12,display:'inline-flex',alignItems:'center',gap:4}}>
                  {item}: <span className="mono">{act??'?'}/{exp}</span>
                  {diff!==null&&diff<0&&<span className="c-red mono"> ▼{Math.abs(diff)}</span>}
                  {diff!==null&&diff>0&&<span className="c-amber mono"> ▲{diff}</span>}
                  {isShort&&<button className="btn btn-ghost btn-sm" style={{fontSize:9,padding:'1px 6px',color:'var(--accent)',borderColor:'var(--accent)'}}
                    onClick={()=>{
                      if(!window.confirm(`Put ${missing} × ${item} back on the warehouse shelf and mark ${entry.lodge} as no longer short on it?\n\nThis adjusts stock and can't be undone.`)) return;
                      saveShelf({...shelf, [item]:(shelf[item]||0)+missing}, 'short_returned_to_stock', {lodge: entry.lodge, item, missing, source: 'history_tab'});
                      saveCounts(counts.map(c=>{
                        if(c.id!==entry.id) return c;
                        const actual={...c.actual,[item]:(c.actual[item]||0)+missing};
                        const shorts=(c.shorts||[]).filter(s=>s!==item);
                        return {...c,actual,shorts,hasShort:shorts.length>0};
                      }), {action:'short_corrected', lodge:entry.lodge, item, missing, source:'history_tab'});
                    }}>📦+{missing}</button>}
                </span>;
              })
          }
        </div>
      </div>;
    })}
  </>;
}


// ── LODGE STOCK TAB ───────────────────────────────────────────────────────────
function LodgeStockTab({lodges, lodgeStatus, saveLodgeStatus, pendingReturns, savePendingReturns, shelf, saveShelf}) {
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [form, setForm] = useState({status:'short', items:{}, comment:'', useOwnLinen:false});
  const [pendingForm, setPendingForm] = useState({lodge:'', items:{}, comment:''});
  const [view, setView] = useState('list'); // list | edit | pending

  const lodgeNames = Object.keys(lodges).sort();
  const filtered = lodgeNames.filter(l => l.toLowerCase().includes(search.toLowerCase()));

  const getStatus = lodge => lodgeStatus[lodge] || {status:'full'};

  const statusChip = (status) => {
    if (status==='full')    return <span className="lodge-status-chip ls-full">✓ Full</span>;
    if (status==='short')   return <span className="lodge-status-chip ls-short">⚠ Short</span>;
    if (status==='own')     return <span className="lodge-status-chip ls-own">🔄 Own Linen</span>;
    return <span className="lodge-status-chip ls-unknown">— Unknown</span>;
  };

  const openEdit = lodge => {
    const s = getStatus(lodge);
    setSelected(lodge);
    setForm({
      status: s.status || 'full',
      items: s.items || {},
      comment: s.comment || '',
      useOwnLinen: s.useOwnLinen || false
    });
    setView('edit');
  };

  const saveStatus = () => {
    const updated = {...lodgeStatus, [selected]: {
      ...form,
      updatedAt: new Date().toISOString()
    }};
    saveLodgeStatus(updated);
    setView('list');
  };

  const clearStatus = lodge => {
    const updated = {...lodgeStatus, [lodge]: {status:'full', updatedAt: new Date().toISOString()}};
    saveLodgeStatus(updated);
  };

  const addPending = () => {
    if (!pendingForm.lodge) return;
    const entry = {
      id: Date.now(),
      lodge: pendingForm.lodge,
      items: {...pendingForm.items},
      comment: pendingForm.comment,
      date: todayStr(),
      ts: new Date().toISOString()
    };
    savePendingReturns([entry, ...pendingReturns]);
    setPendingForm({lodge:'', items:{}, comment:''});
    setView('list');
  };

  const receivePending = (id) => {
    const entry = pendingReturns.find(p => p.id === id);
    if (!entry) return;
    // Add items to shelf stock
    const newShelf = {...shelf};
    Object.keys(entry.items).forEach(item => {
      newShelf[item] = (newShelf[item] || 0) + (entry.items[item] || 0);
    });
    saveShelf(newShelf, 'pending_return_received', {lodge: entry.lodge, items: entry.items, comment: entry.comment});
    savePendingReturns(pendingReturns.filter(p => p.id !== id));
  };

  const shortLodges = lodgeNames.filter(l => {
    const s = getStatus(l);
    return s.status === 'short' || s.status === 'own' || s.status === 'unknown';
  });

  if (view === 'edit') return (
    <div className="card">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setView('list')}>← Back</button>
        <div style={{fontSize:16,fontWeight:700}}>{selected} — Stock Status</div>
      </div>

      <div style={{marginBottom:12}}>
        <div className="card-title">Status</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {[['full','✓ Full'],['short','⚠ Short'],['own','🔄 Own Linen Used'],['unknown','— Unknown']].map(([v,l]) =>
            <button key={v} className={`btn btn-sm ${form.status===v?'btn-primary':'btn-ghost'}`}
              onClick={()=>setForm(p=>({...p,status:v}))}>{l}</button>
          )}
        </div>
      </div>

      {(form.status==='short'||form.status==='own') && <>
        <div className="card-title" style={{marginTop:12}}>Missing Items</div>
        <table className="tbl">
          <thead><tr><th>Item</th><th className="center">Expected</th><th className="center">Missing</th></tr></thead>
          <tbody>
            {ITEMS.filter(i=>(lodges[selected]&&lodges[selected][i]||0)>0).map(item => {
              const exp = lodges[selected][item]||0;
              return <tr key={item}>
                <td className="item-name">{item}</td>
                <td className="center exp-val">{exp}</td>
                <td><div className="stepper">
                  <button className="step-btn" onClick={()=>setForm(p=>({...p,items:{...p.items,[item]:Math.max(0,(p.items[item]||0)-1)}}))}>−</button>
                  <input className="step-inp" type="number" min="0" value={form.items[item]||0}
                    onChange={e=>setForm(p=>({...p,items:{...p.items,[item]:Math.max(0,parseInt(e.target.value)||0)}}))}/>
                  <button className="step-btn" onClick={()=>setForm(p=>({...p,items:{...p.items,[item]:(p.items[item]||0)+1}}))}>+</button>
                </div></td>
              </tr>;
            })}
          </tbody>
        </table>
        {form.status==='own' && <div style={{marginTop:8}}>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--text2)',cursor:'pointer'}}>
            <input type="checkbox" checked={form.useOwnLinen}
              onChange={e=>setForm(p=>({...p,useOwnLinen:e.target.checked}))}/>
            Topped up with own linen
          </label>
        </div>}
      </>}

      <div style={{marginTop:12}}>
        <div className="card-title">Comment</div>
        <input type="text" placeholder="e.g. bed not used, items coming back next visit..."
          value={form.comment} onChange={e=>setForm(p=>({...p,comment:e.target.value}))}/>
      </div>

      <div className="btn-row">
        <button className="btn btn-ghost" onClick={()=>setView('list')}>Cancel</button>
        <button className="btn btn-primary" onClick={saveStatus}>✓ Save Status</button>
      </div>
    </div>
  );

  if (view === 'pending') return (
    <div className="card">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setView('list')}>← Back</button>
        <div style={{fontSize:16,fontWeight:700}}>Log Pending Return</div>
      </div>
      <div style={{marginBottom:12}}>
        <div className="card-title">Lodge</div>
        <select value={pendingForm.lodge} onChange={e=>setPendingForm(p=>({...p,lodge:e.target.value}))}>
          <option value="">Select lodge...</option>
          {lodgeNames.map(l => <option key={l} value={l}>{l}</option>)}
        </select>
      </div>
      {pendingForm.lodge && <>
        <div className="card-title">Items Coming Back (do not count yet)</div>
        <table className="tbl">
          <thead><tr><th>Item</th><th className="center">Qty</th></tr></thead>
          <tbody>
            {ITEMS.filter(i=>(lodges[pendingForm.lodge]&&lodges[pendingForm.lodge][i]||0)>0).map(item => (
              <tr key={item}>
                <td className="item-name">{item}</td>
                <td><div className="stepper">
                  <button className="step-btn" onClick={()=>setPendingForm(p=>({...p,items:{...p.items,[item]:Math.max(0,(p.items[item]||0)-1)}}))}>−</button>
                  <input className="step-inp" type="number" min="0" value={pendingForm.items[item]||0}
                    onChange={e=>setPendingForm(p=>({...p,items:{...p.items,[item]:Math.max(0,parseInt(e.target.value)||0)}}))}/>
                  <button className="step-btn" onClick={()=>setPendingForm(p=>({...p,items:{...p.items,[item]:(p.items[item]||0)+1}}))}>+</button>
                </div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </>}
      <div style={{marginTop:12}}>
        <div className="card-title">Comment</div>
        <input type="text" placeholder="e.g. found after clean, bed not used..."
          value={pendingForm.comment} onChange={e=>setPendingForm(p=>({...p,comment:e.target.value}))}/>
      </div>
      <div className="btn-row">
        <button className="btn btn-ghost" onClick={()=>setView('list')}>Cancel</button>
        <button className="btn btn-primary" onClick={addPending}>✓ Log Pending Return</button>
      </div>
    </div>
  );

  return <>
    {shortLodges.length > 0 && <div className="card" style={{background:'rgba(229,62,62,.05)',border:'1px solid rgba(229,62,62,.2)'}}>
      <div className="card-title" style={{color:'var(--red)'}}>⚠ Lodges with Stock Issues ({shortLodges.length})</div>
      {shortLodges.map(lodge => {
        const s = getStatus(lodge);
        const missingItems = Object.keys(s.items||{}).filter(i=>(s.items[i]||0)>0);
        return <div key={lodge} style={{padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>{lodge} {statusChip(s.status)}</div>
              {missingItems.length>0 && <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>
                Missing: {missingItems.map(i=>`${s.items[i]} ${i}`).join(', ')}
              </div>}
              {s.comment && <div style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',marginTop:2}}>{s.comment}</div>}
            </div>
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>openEdit(lodge)}>Edit</button>
              <button className="btn btn-success btn-sm" onClick={()=>clearStatus(lodge)}>✓ Clear</button>
            </div>
          </div>
        </div>;
      })}
    </div>}

    {pendingReturns.length > 0 && <div className="card" style={{background:'rgba(79,124,255,.05)',border:'1px solid rgba(79,124,255,.2)'}}>
      <div className="card-title" style={{color:'var(--accent)'}}>📦 Pending Returns ({pendingReturns.length})</div>
      {pendingReturns.map(entry => {
        const items = Object.keys(entry.items).filter(i=>(entry.items[i]||0)>0);
        return <div key={entry.id} style={{padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>{entry.lodge} <span style={{fontSize:11,color:'var(--text3)',fontFamily:'DM Mono,monospace'}}>{fmtDate(entry.date)}</span></div>
              <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>{items.map(i=>`${entry.items[i]} ${i}`).join(', ')}</div>
              {entry.comment && <div style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',marginTop:2}}>{entry.comment}</div>}
            </div>
            <button className="btn btn-success btn-sm" onClick={()=>receivePending(entry.id)}>✓ Received</button>
          </div>
        </div>;
      })}
    </div>}

    <div className="btn-row" style={{marginBottom:12}}>
      <button className="btn btn-ghost" onClick={()=>setView('pending')}>📦 Log Pending Return</button>
    </div>

    <div className="card">
      <div className="card-title">All Lodges</div>
      <input className="lodge-search" type="text" placeholder="Search lodge..." value={search}
        onChange={e=>setSearch(e.target.value)}/>
      {filtered.map(lodge => {
        const s = getStatus(lodge);
        const missingItems = Object.keys(s.items||{}).filter(i=>(s.items[i]||0)>0);
        return <div key={lodge} style={{display:'flex',justifyContent:'space-between',alignItems:'center',
          padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
          <div>
            <div style={{fontWeight:600,fontSize:13}}>{lodge} {statusChip(s.status)}</div>
            {missingItems.length>0 && <div style={{fontSize:11,color:'var(--red)',marginTop:2}}>
              {missingItems.map(i=>`${s.items[i]} ${i}`).join(', ')} missing
            </div>}
            {s.comment && <div style={{fontSize:11,color:'var(--text3)',fontStyle:'italic',marginTop:2}}>{s.comment}</div>}
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>openEdit(lodge)}>Edit</button>
        </div>;
      })}
    </div>
  </>;
}


// ── GL SUMMARY TAB ────────────────────────────────────────────────────────────
function GlSummaryTab({glFlow, watchList}) {
  const ITEMS = ['Bath Sheet','Bath Mat','Hand Towel','S King D','S King S',
                 'King D','King S','Single D','Single S','Pillow C','Oxford','Tea Towel'];

  // Find last collection and last delivery
  const lastCollection = glFlow.find(g => g.type === 'collection');
  const lastDelivery   = [...glFlow].filter(g=>g.type==='delivery').sort((a,b)=>b.date>a.date?1:-1)[0];
  const lastDeliveryDate = lastDelivery ? lastDelivery.date : null;

  // Calculate totals
  const totalCollected = {}, totalDelivered = {};
  glFlow.forEach(entry => {
    ITEMS.forEach(item => {
      if (entry.type==='collection') totalCollected[item]=(totalCollected[item]||0)+(entry.data[item]||0);
      else if (entry.type==='delivery') totalDelivered[item]=(totalDelivered[item]||0)+(entry.data[item]||0);
    });
  });

  // Currently with GL = ALL collections since last delivery combined
  const pendingCollections = glFlow.filter(g =>
    g.type==='collection' && (!lastDeliveryDate || g.date>=lastDeliveryDate)
  );
  const withGL = {};
  ITEMS.forEach(item => {
    withGL[item] = pendingCollections.reduce((sum,col) => sum+(col.data[item]||0), 0);
  });

  const hasWithGL   = Object.values(withGL).some(v => v > 0);
  const unresolvedWatch = watchList.filter(w => !w.resolved);

  return <>
    {/* Currently with GL */}
    <div className="card">
      <div className="card-title">Currently with GL</div>
      {lastCollection
        ? <div style={{fontSize:12,color:'var(--text3)',marginBottom:12,fontFamily:'DM Mono,monospace'}}>
            {pendingCollections.length} collection{pendingCollections.length!==1?'s':''} with GL
            {lastDelivery ? ' — last delivery ' + fmtDate(lastDelivery.date) : ' — awaiting delivery'}
          </div>
        : null}
      {!lastCollection
        ? <div className="empty" style={{padding:'20px 0'}}><div className="empty-icon">🔄</div>No GL collections recorded yet</div>
        : !hasWithGL
        ? <div style={{color:'var(--green)',fontWeight:600,fontSize:14}}>✓ All linen has been returned by GL</div>
        : <table className="tbl">
            <thead><tr>
              <th>Item</th>
              <th className="center">With GL</th>
            </tr></thead>
            <tbody>{ITEMS.filter(i => (withGL[i]||0) > 0).map(item => (
              <tr key={item}>
                <td className="item-name">{item}</td>
                <td className="center mono" style={{fontWeight:700,color:'var(--accent)'}}>{withGL[item]}</td>
              </tr>
            ))}</tbody>
          </table>}
    </div>

    {/* Last Collection */}
    {lastCollection && <div className="card">
      <div className="card-title">Last Collection — {fmtDate(lastCollection.date)}</div>
      <table className="tbl">
        <thead><tr><th>Item</th><th className="center">Qty</th></tr></thead>
        <tbody>{ITEMS.filter(i=>(lastCollection.data[i]||0)>0).map(item => (
          <tr key={item}>
            <td className="item-name">{item}</td>
            <td className="center mono">{lastCollection.data[item]}</td>
          </tr>
        ))}</tbody>
      </table>
      {lastCollection.notes && <div style={{marginTop:8,fontSize:12,color:'var(--text2)',fontStyle:'italic'}}>Note: {lastCollection.notes}</div>}
      {lastCollection.extras && Object.values(lastCollection.extras).some(v=>v>0) && <>
        <div style={{marginTop:12,fontWeight:600,fontSize:13,color:'var(--text2)'}}>Extras included:</div>
        {ITEMS.filter(i=>(lastCollection.extras[i]||0)>0).map(item => (
          <div key={item} style={{fontSize:12,color:'var(--text2)',padding:'2px 0'}}>
            {item}: <span style={{fontWeight:700}}>{lastCollection.extras[item]}</span>
          </div>
        ))}
      </>}
    </div>}

    {/* Last Delivery */}
    {lastDelivery && <div className="card">
      <div className="card-title">Last Delivery — {fmtDate(lastDelivery.date)}</div>
      <table className="tbl">
        <thead><tr><th>Item</th><th className="center">Received</th></tr></thead>
        <tbody>{ITEMS.filter(i=>(lastDelivery.data[i]||0)>0).map(item => (
          <tr key={item}>
            <td className="item-name">{item}</td>
            <td className="center mono">{lastDelivery.data[item]}</td>
          </tr>
        ))}</tbody>
      </table>
      {lastDelivery.missing?.length > 0 && <div style={{marginTop:8,background:'rgba(229,62,62,.08)',border:'1px solid rgba(229,62,62,.2)',borderRadius:'8px',padding:'10px 12px'}}>
        <div style={{fontWeight:700,color:'var(--red)',fontSize:13,marginBottom:6}}>⚠ Short on delivery:</div>
        {lastDelivery.missing.map(m => (
          <div key={m.item} style={{fontSize:12,color:'var(--text2)',padding:'2px 0'}}>
            {m.item}: sent {m.sent}, received {m.received} — <span style={{color:'var(--red)',fontWeight:700}}>{m.short} missing</span>
          </div>
        ))}
      </div>}
    </div>}

    {/* Watch List */}
    {unresolvedWatch.length > 0 && <div className="card" style={{background:'rgba(245,158,11,.06)',border:'1px solid rgba(245,158,11,.2)'}}>
      <div className="card-title" style={{color:'var(--amber)'}}>⚠ Outstanding — Items Still Owed by GL ({unresolvedWatch.length})</div>
      {unresolvedWatch.map(w => (
        <div key={w.id} style={{padding:'7px 0',borderBottom:'1px solid var(--border)',fontSize:13}}>
          <span style={{fontWeight:600}}>{w.item}</span> — 
          <span className="c-red mono"> {w.short} missing</span>
          <span style={{fontSize:11,color:'var(--text3)',marginLeft:8}}>from {fmtDate(w.fromDate)} · sent {w.sent}, received {w.received}</span>
        </div>
      ))}
    </div>}
  </>;
}


// ── DAILY REPORT TAB ──────────────────────────────────────────────────────────
function DailyReportTab({counts, todayCheckouts, deferred, saveDeferred, lodges, shelf, saveShelf, saveCounts}) {
  const [reportDate, setReportDate] = useState(todayStr());

  const dateCheckouts = todayCheckouts; // for today — could extend to other dates

  // Get all counts for report date
  const dateCounts = counts.filter(c => c.date === reportDate && c.type !== 'stockout');
  const dateStockOuts = counts.filter(c => c.date === reportDate && c.type === 'stockout');
  const countedLodges = new Set(dateCounts.map(c => c.lodge));
  const stockOutLodges = new Set(dateStockOuts.map(c => c.lodge));

  // For today use todayCheckouts, for other dates use all lodges that had counts
  const checkoutsForDate = reportDate === todayStr()
    ? todayCheckouts
    : [...new Set([...dateCounts.map(c=>c.lodge), ...dateStockOuts.map(c=>c.lodge)])];

  const uncounted = checkoutsForDate.filter(l => {
    if (deferred && deferred[l] === reportDate) return false;
    return !countedLodges.has(l);
  });
  const deferredLodges = checkoutsForDate.filter(l => deferred && deferred[l] === reportDate);

  const undefferLodge = (lodge) => {
    const updated = {...(deferred||{})};
    delete updated[lodge];
    saveDeferred(updated);
  };

  // Totals
  const ITEMS = ['Bath Sheet','Bath Mat','Hand Towel','S King D','S King S',
                 'King D','King S','Single D','Single S','Pillow C','Oxford','Tea Towel'];

  const actualTotals = {};
  const expectedTotals = {};
  ITEMS.forEach(item => { actualTotals[item] = 0; expectedTotals[item] = 0; });

  dateCounts.forEach(c => {
    ITEMS.forEach(item => {
      if (c.actual[item] != null) actualTotals[item] += c.actual[item];
      if (c.expected[item]) expectedTotals[item] += c.expected[item];
    });
  });

  const shortLodges = dateCounts.filter(c => c.hasShort);
  const overLodges  = dateCounts.filter(c => c.hasOver && !c.hasShort);

  // ── Reconciliation: bag-ins with no matching delivery ───────────────────
  // Every bag-in (dirty back) needs a delivery (clean out) logged before it.
  // Over the 7 days up to reportDate, per lodge, compare bag-in vs delivery
  // counts. If bag-ins exceed deliveries, a delivery was never logged — the
  // cause of stock drift (e.g. HM92: 2 in, 1 out -> 1 missing). Returned-unused
  // deliveries don't count as a real delivery.
  const reconList = React.useMemo(() => {
    const start = new Date(reportDate + 'T12:00:00'); start.setDate(start.getDate()-7);
    const startStr = start.toISOString().split('T')[0];
    const byLodge = {};
    counts.forEach(c => {
      if (!c || !c.lodge || !c.date) return;
      if (c.date < startStr || c.date > reportDate) return;
      const L = byLodge[c.lodge] || (byLodge[c.lodge] = {bagIns:0, deliveries:0});
      if (c.type==='stockout') { if (!c.returnedUnused) L.deliveries++; }
      else                     { L.bagIns++; }
    });
    return Object.keys(byLodge)
      .map(l => ({lodge:l, bagIns:byLodge[l].bagIns, deliveries:byLodge[l].deliveries,
                  missing: byLodge[l].bagIns - byLodge[l].deliveries}))
      .filter(r => r.missing > 0)
      .sort((a,b) => b.missing - a.missing || a.lodge.localeCompare(b.lodge));
  }, [counts, reportDate]);
  const reconTotal = reconList.reduce((s,r)=>s+r.missing,0);

  // Log a missing delivery for a flagged lodge: deduct a FULL standard set from
  // shelf stock and record a stockout entry, on a date you pick. Reuses the same
  // data shape + save path as a normal delivery (confirmStockOut), so the audit
  // trail and stock maths are identical. Once logged, the lodge's delivery count
  // rises and it drops off the reconciliation list — preventing double-logging.
  const logMissingDelivery = (lodge) => {
    const full = lodges[lodge] || {};
    const items = ITEMS.filter(i => (full[i]||0) > 0);
    if (!items.length) { window.alert(`No standard set defined for ${lodge}.`); return; }
    // Default the date to the day before the report date (delivery precedes bag-in)
    const def = new Date(reportDate + 'T12:00:00'); def.setDate(def.getDate()-1);
    const defStr = def.toISOString().split('T')[0];
    const dateStr = window.prompt(
      `Log a missing delivery for ${lodge}?\n\n` +
      `This deducts a FULL standard set from warehouse stock:\n` +
      items.map(i => '  ' + i + ': ' + full[i]).join('\n') +
      `\n\nEnter the delivery date (YYYY-MM-DD):`, defStr);
    if (dateStr === null) return; // cancelled
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) { window.alert('Date must be YYYY-MM-DD. Nothing logged.'); return; }
    const qty = {}; items.forEach(i => { qty[i] = full[i]; });
    const entry = {
      id: Date.now(), type: 'stockout', lodge,
      date: dateStr, forCheckoutDate: dateStr,
      actual: {...qty}, staffName: 'reconciliation',
      ts: new Date().toISOString(), reconciled: true
    };
    const newShelf = {...shelf};
    items.forEach(i => { newShelf[i] = (newShelf[i]||0) - qty[i]; }); // no floor, matches delivery logic
    saveCounts([entry, ...counts]);
    saveShelf(newShelf, 'missing_delivery_logged',
      {lodge, date: dateStr, qty: {...qty}, staffName: 'reconciliation'});
  };

  return <>
    <div className="card">
      <div className="card-title">Report Date</div>
      <input type="date" value={reportDate} onChange={e=>setReportDate(e.target.value)}/>
    </div>

    {/* Summary stats */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:12}}>
      {[
        ['Checkouts', checkoutsForDate.length, 'var(--accent)'],
        ['Counted', countedLodges.size, 'var(--green)'],
        ['Not Counted', uncounted.length, uncounted.length>0?'var(--red)':'var(--green)'],
      ].map(([label,val,color]) => <div key={label} className="card" style={{textAlign:'center',marginBottom:0}}>
        <div className="card-title" style={{margin:0,marginBottom:4}}>{label}</div>
        <div style={{fontSize:36,fontWeight:700,color,fontFamily:'DM Mono,monospace'}}>{val}</div>
      </div>)}
    </div>

    {/* Reconciliation — bag-ins with no matching delivery (7 days up to report date) */}
    <div className="card" style={reconTotal>0
        ? {background:'rgba(229,62,62,.05)',border:'1px solid rgba(229,62,62,.2)',marginBottom:12}
        : {background:'rgba(34,197,94,.06)',border:'1px solid rgba(34,197,94,.3)',marginBottom:12}}>
      <div className="card-title" style={{marginBottom:reconTotal>0?10:0,color:reconTotal>0?'var(--red)':'var(--green)'}}>
        {reconTotal>0
          ? `⚠ Unlogged Deliveries — ${reconTotal} bag${reconTotal!==1?'s':''} in with no delivery (7 days)`
          : '✓ All bag-ins reconciled (7 days)'}
      </div>
      {reconTotal>0 && <>
        <div style={{fontSize:12,color:'var(--text2)',marginBottom:10}}>
          Every bag in needs a delivery logged before it. These lodges had dirty bags back
          with no matching delivery — likely clean linen sent but not recorded on the
          Delivery tab. Each missing delivery is stock that left the warehouse but wasn't deducted.
        </div>
        {reconList.map(r => (
          <div key={r.lodge} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
              padding:'7px 0',borderBottom:'1px solid var(--border)',gap:8,flexWrap:'wrap'}}>
            <span style={{fontWeight:700,fontSize:14}}>{r.lodge}</span>
            <span style={{display:'flex',alignItems:'center',gap:10,fontSize:12,fontFamily:'DM Mono,monospace'}}>
              <span style={{color:'var(--text3)'}}>{r.bagIns} in / {r.deliveries} out</span>
              <span style={{color:'var(--red)',fontWeight:700,background:'rgba(229,62,62,.12)',
                  borderRadius:8,padding:'2px 8px'}}>{r.missing} missing</span>
              <button className="btn btn-ghost btn-sm" style={{fontSize:11,padding:'4px 10px'}}
                onClick={()=>logMissingDelivery(r.lodge)}>+ Log delivery</button>
            </span>
          </div>
        ))}
      </>}
    </div>
    {uncounted.length > 0 && <div className="card" style={{background:'rgba(229,62,62,.05)',border:'1px solid rgba(229,62,62,.2)',marginBottom:12}}>
      <div className="card-title" style={{color:'var(--red)'}}>❌ Not Counted ({uncounted.length})</div>
      {uncounted.map(l => <div key={l} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
        <span style={{fontWeight:700,color:'var(--red)'}}>{l}</span>
        <button className="btn btn-ghost btn-sm" onClick={()=>saveDeferred({...(deferred||{}),[l]:reportDate})}
          style={{fontSize:11}}>→ Defer</button>
      </div>)}
    </div>}

    {/* Deferred lodges */}
    {deferredLodges.length > 0 && <div className="card" style={{background:'rgba(245,158,11,.05)',border:'1px solid rgba(245,158,11,.2)',marginBottom:12}}>
      <div className="card-title" style={{color:'var(--amber)'}}>→ Deferred to Tomorrow ({deferredLodges.length})</div>
      {deferredLodges.map(l => <div key={l} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
        <span style={{fontWeight:700,color:'var(--amber)'}}>{l}</span>
        <button className="btn btn-ghost btn-sm" onClick={()=>undefferLodge(l)} style={{fontSize:11}}>✕ Remove</button>
      </div>)}
    </div>}

    {/* Counted with issues */}
    {shortLodges.length > 0 && <div className="card" style={{background:'rgba(229,62,62,.05)',border:'1px solid rgba(229,62,62,.2)',marginBottom:12}}>
      <div className="card-title" style={{color:'var(--red)'}}>⚠ Counted — Items Missing ({shortLodges.length})</div>
      {shortLodges.map(c => <div key={c.id} style={{padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
        <div style={{fontWeight:700,fontSize:14}}>{c.lodge}</div>
        <div style={{fontSize:12,color:'var(--text2)'}}>Missing: {c.shorts.join(', ')}</div>
      </div>)}
    </div>}

    {/* Linen totals */}
    {dateCounts.length > 0 && <div className="card">
      <div className="card-title">Linen Counted In — Totals</div>
      <table className="tbl">
        <thead><tr><th>Item</th><th className="center">Expected</th><th className="center">Actual</th><th className="center">Diff</th></tr></thead>
        <tbody>
          {ITEMS.filter(i=>expectedTotals[i]>0||actualTotals[i]>0).map(item => {
            const exp=expectedTotals[item], act=actualTotals[item], diff=act-exp;
            const color=diff<0?'var(--red)':diff>0?'var(--amber)':'var(--green)';
            return <tr key={item}>
              <td className="item-name">{item}</td>
              <td className="center mono">{exp||'—'}</td>
              <td className="center mono">{act||'—'}</td>
              <td className="center mono" style={{color,fontWeight:700}}>
                {diff===0?'✓':diff>0?`+${diff}`:diff}
              </td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>}

    {dateCounts.length === 0 && uncounted.length === 0 &&
      <div className="empty"><div className="empty-icon">📋</div>No data for this date</div>}
  </>;
}

// ── SETTINGS TAB ──────────────────────────────────────────────────────────────
function SettingsTab({lodges, saveLodges}) {
  const [name, setName] = useState('');
  const [quantities, setQuantities] = useState({});
  const [saved, setSaved] = useState(false);
  const [deleting, setDeleting] = useState(null);

  const addLodge = () => {
    if (!name.trim()) return;
    const code = name.trim().toUpperCase();
    if (lodges[code] && !window.confirm(`Lodge ${code} already exists.\n\nOverwrite its saved par set with the quantities on screen? Any item left at 0 will overwrite the old amount.`)) return;
    saveLodges({...lodges,[code]:{...quantities}});
    setName(''); setQuantities({}); setSaved(true);
    setTimeout(()=>setSaved(false),2000);
  };
  const deleteLodge = lodge => { const n={...lodges}; delete n[lodge]; saveLodges(n); setDeleting(null); };

  return <>
    {saved && <div className="card" style={{background:'rgba(34,197,94,.1)',border:'1px solid rgba(34,197,94,.3)',marginBottom:12}}>
      <div style={{color:'var(--green)',fontWeight:700}}>✓ Lodge added successfully</div>
    </div>}
    <div className="card">
      <div className="card-title">Add New Lodge</div>
      <div style={{marginBottom:12}}>
        <div className="field-label" style={{marginBottom:4}}>Lodge Code</div>
        <input type="text" placeholder="e.g. ML29" value={name} onChange={e=>setName(e.target.value.toUpperCase())}/>
      </div>
      <div className="section-hdr">Linen Quantities</div>
      <table className="tbl">
        <thead><tr><th>Item</th><th className="center">Qty</th></tr></thead>
        <tbody>{ITEMS.map(item => <tr key={item}>
          <td className="item-name">{item}</td>
          <td><div className="stepper">
            <button className="step-btn" onClick={()=>setQuantities(p=>({...p,[item]:Math.max(0,(p[item]||0)-1)}))}>−</button>
            <input className="step-inp" type="number" min="0" value={quantities[item]??0} onChange={e=>setQuantities(p=>({...p,[item]:Math.max(0,parseInt(e.target.value)||0)}))}/>
            <button className="step-btn" onClick={()=>setQuantities(p=>({...p,[item]:(p[item]||0)+1}))}>+</button>
          </div></td>
        </tr>)}</tbody>
      </table>
      <button className="btn btn-primary btn-full" style={{marginTop:12}} onClick={addLodge}>+ Add Lodge</button>
    </div>
    <div className="card">
      <div className="card-title">Manage Lodges ({Object.keys(lodges).length})</div>
      {Object.keys(lodges).sort().map(lodge => <div key={lodge} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
        <div style={{fontWeight:600}}>{lodge}</div>
        {deleting===lodge ? <div style={{display:'flex',gap:6}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setDeleting(null)}>Cancel</button>
          <button className="btn btn-danger btn-sm" onClick={()=>deleteLodge(lodge)}>Delete</button>
        </div> : <button className="btn btn-ghost btn-sm" onClick={()=>setDeleting(lodge)}>Remove</button>}
      </div>)}
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
